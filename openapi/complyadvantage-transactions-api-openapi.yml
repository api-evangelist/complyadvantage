openapi: 3.2.0
info:
  title: Mesh Transactions API
  version: v2.0
servers:
- description: ComplyAdvantage Mesh API
  url: https://api.mesh.complyadvantage.com
security:
- BearerAuth: []
tags:
- name: Transactions
paths:
  /v3/transactions:
    get:
      description: 'Returns all transactions in an account with the ability to search, sort and filter.

        You need the "View Transactions" permission to use this endpoint.

        Additionally, you need either "Access to base transaction monitoring functionality" and/or "Access to base payment screening functionality" to use this endpoint.'
      operationId: meshSearchServiceGetTransactions
      parameters:
      - description: 'Sorting criteria. Allowed fields: `occurred_at`, `received_at` (default), `base_value.amount`, `base_value.currency`, `direction`. Each criterion should be a string in the format: `property_name` for ascending order, or `-property_name` for descending order. For example, to sort by occurred date descending: `-occurred_at`. Multiple sort criteria are supported. Provide each as a separate ''sort'' query parameter (e.g., `?sort=-occurred_at&sort=base_value.amount`).'
        example:
        - -occurred_at
        - base_value.amount
        in: query
        name: sort
        required: false
        schema:
          items:
            example: -direction
            type: string
          type: array
      - description: Search for a transaction using your transaction identifier. Partial Match.
        example: 00000000-0000-0000-0000-000000000000
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: Search for a full match using the identifier of the customer associated with the transaction.
        example: 00000000-0000-0000-0000-000000000000
        in: query
        name: customer.identifier
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by specific transaction identifiers. Returns transactions matching any of the provided IDs (OR logic). Can be combined with other filters.
        example:
        - 00000000-0000-0000-0000-000000000000
        - 11111111-1111-1111-1111-111111111111
        in: query
        name: identifier
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
      - description: Filter by minimum received date/time (inclusive). ISO 8601 format.
        example: '2023-10-26T11:00:00.000Z'
        in: query
        name: received_at_from
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter by maximum received date/time (inclusive). ISO 8601 format.
        example: '2023-10-27T11:00:00.000Z'
        in: query
        name: received_at_to
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter by minimum occurred date/time (inclusive). ISO 8601 format.
        example: '2023-10-26T10:00:00.000Z'
        in: query
        name: occurred_at_from
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter by maximum occurred date/time (inclusive). ISO 8601 format.
        example: '2023-10-27T10:00:00.000Z'
        in: query
        name: occurred_at_to
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter by transaction direction.
        example:
        - INBOUND
        in: query
        name: direction
        required: false
        schema:
          items:
            enum:
            - INBOUND
            - OUTBOUND
            type: string
          type: array
      - description: Filter by currency code (ISO 4217).
        example:
        - USD
        - EUR
        in: query
        name: base_value.currency
        required: false
        schema:
          items:
            enum:
            - AED
            - AFN
            - ALL
            - AMD
            - ANG
