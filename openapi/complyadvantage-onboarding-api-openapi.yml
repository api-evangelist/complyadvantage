  /v2/workflows/{workflow_instance_identifier}:
    get:
      description: '## Overall workflow status


        This endpoint will return the status and eventual end result of the specified workflow. Once a workflow has been initiated, it can be periodically polled to receive the status using the workflow-instance-identifier provided in the response of the POST `v2/workflows/create-and-screen`


        The response comprises the status of the overall workflow. One of

        - `NOT-STARTED` - The workflow is queued but has not yet begun

        - `IN-PROGRESS` - The workflow is executing but not yet completed. The step details should be checked to ascertain progress

        - `COMPLETED` - The workflow has completed execution without errors. The step details should be checked to ascertain the end results

        - `ERRORED` - The workflow has completed with errors.


        In addition to the status, the workflow endpoint returns:


        - `steps` - an array of the step keys within the workflow

        - `step_details` - an object containing the status and return values for each of steps within the workflow (see following section)


        ## Workflow steps


        The workflow response contains a `step_details` object, which contains the status and returned values from each step in the workflow. Each step object within the step_details contains a status field that can be one of the following values:


        - `NOT-STARTED` - The step has not yet been executed

        - `IN-PROGRESS` - The step is executing

        - `COMPLETED` - The step has completed and the step_output object can be checked for output

        - `SKIPPED` - The step has been skipped because it did not meet the criteria for execution. In the case of the “create and screen" workflow, this applies to the screening step when the customer risk is prohibited

        - `ERRORED` - The step has completed but returned errors


        In addition to the status, the step detail contains:


        - `identifier` - a unique identifier for the step

        - `step_output` - an object containing the return values for the step'
      operationId: getWorkflowState
      parameters:
      - example: 95913b76-050c-40f3-9075-25f0737ac7d3
        in: path
        name: workflow_instance_identifier
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                WORKFLOW COMPLETED:
                  description: Once all step workflows are marked as COMPLETED then the workflow status will be marked as COMPLETED. If the screening result is returned as HAS_PROFILES then remediation is required on the ComplyAdvantage application. If the screening results return NO_PROFILES then no remediation is required. The full customer record can be retrieved by calling GET /v1/customer/ using the identifier from customer-creation step with step_details.
                  value:
                    status: COMPLETED
                    step_details:
                      alerting:
                        identifier: null
                        status: COMPLETED
                        step_output:
                          alerts:
                          - identifier: 019c7636-6f05-7d5a-8b75-12e99e209a01
                      case-creation:
                        identifier: 019c7636-6fa7-795e-89db-769bf399baa2
                        status: COMPLETED
                        step_output:
                          case_identifier: 019c7636-6fa7-795e-89db-769bf399baa2
                      customer-creation:
                        identifier: 019c7636-61ea-79f0-b4c1-f61edb37ff2a
                        status: COMPLETED
                        step_output:
                          customer_identifier: 019c7636-621d-72b7-9bea-a18c12f945ee
                          external_identifier: sample-ext-identifier
                      customer-screening:
                        identifier: 019c7636-626a-7129-8d7f-d2e010a9d0a9
                        status: COMPLETED
                        step_output:
                          aml_types:
                          - ADVERSE_MEDIA
                          - ADVERSE_MEDIA_V2_CYBERCRIME
                          - ADVERSE_MEDIA_V2_FRAUD_LINKED
                          - ADVERSE_MEDIA_V2_GENERAL_AML_CFT
                          - ADVERSE_MEDIA_V2_NARCOTICS_AML_CFT
                          - ADVERSE_MEDIA_V2_OTHER_FINANCIAL
                          - ADVERSE_MEDIA_V2_OTHER_MINOR
                          - ADVERSE_MEDIA_V2_OTHER_SERIOUS
                          - ADVERSE_MEDIA_V2_PROPERTY
                          - ADVERSE_MEDIA_V2_REGULATORY
                          - ADVERSE_MEDIA_V2_TERRORISM
                          - ADVERSE_MEDIA_V2_VIOLENCE_AML_CFT
                          - ADVERSE_MEDIA_V2_VIOLENCE_NON_AML_CFT
                          screening_result: HAS_PROFILES
                      initial-risk-scoring:
                        identifier: 019c7636-6251-7b33-a4b5-973c718b80b9
                        status: COMPLETED
                        step_output:
                          overall_level: SKIPPED
                          overall_value: 0
                    steps:
                    - customer-creation
                    - initial-risk-scoring
                    - customer-screening
                    - alerting
                    - case-creation
                    workflow_instance_identifier: 019c7636-61cd-7e25-80cd-c7a6660f2349
                    workflow_type: create-and-screen
                WORKFLOW COMPLETED(WITH SKIPPED STEPS):
                  description: It is possible for the workflow to be marked as COMPLETED when initial-risk-scoring returns a PROHIBITED status and customer-screening as SKIPPED depending on the search configuration that has been set. In this scenario there will be no further updates to the risk score after this step.
                  value:
                    status: COMPLETED
                    step_details:
                      alerting:
                        identifier: null
                        status: SKIPPED
                        step_output: {}
                      case-creation:
                        identifier: null
                        status: SKIPPED
                        step_output: {}
                      customer-creation:
                        identifier: 019c7aac-4590-7aef-ae7f-729c8ac9d611
