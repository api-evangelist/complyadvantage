      description: ClearingIdentifier pairs a routing system with its specific value.
      properties:
        type:
          description: ClearingIdentifierType specifies the regional system used to route payments to a specific financial institution. These align with ISO 20022 External Clearing System Identification Codes.
          enum:
          - UK_SORT_CODE
          - US_ABA_ROUTING
          - IN_IFSC
          - AU_BSB
          - CA_TRANSIT
          - DE_BLZ
          - HK_BANK_CODE
          - SG_BANK_CODE
          - NZ_BANK_CODE
          - ZA_CLEARING_CODE
          - CH_SIC
          - JP_ZENGIN
          - OTHER
          type: string
