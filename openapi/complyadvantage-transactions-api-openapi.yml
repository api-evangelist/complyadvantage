          example: Wise
          maxLength: 256
          minLength: 0
          type:
          - string
          - 'null'
      type: object
    search_RemittancePaymentMethodV3:
      description: The payment method used for remittance transactions.
      enum:
      - CASH
      - CREDIT_CARD
      - DEBIT_CARD
      - BANK_TRANSFER
      - MOBILE_WALLET
      - PREPAID_CARD
      - CHEQUE
      - CRYPTOCURRENCY
      - GIFT_CARD
      - POSTAL_ORDER
      - BARTER
      - OTHER
      example: CASH
      type: string
    activity_Caip2IdentifierV3:
      description: The industry standard CAIP-2 Identifier for the blockchain (https://chainagnostic.org/CAIPs/caip-2)
      properties:
        namespace:
          description: Describes an ecosystem or standard, such as e.g. cosmos or eip155. One namespace should refer to one resolution method to resolve the chain’s reference.
          example: eip155
          pattern: '[-a-z0-9]{3,8}'
          type: string
        reference:
          description: The way to identify a blockchain within a given namespace.
          example: '1'
          pattern: '[-_a-zA-Z0-9]{1,32}'
          type: string
      required:
      - namespace
      - reference
      type: object
    activity_PartyIdentificationV3:
      description: Represents the identification details of a party. This includes not just the party's identifier, but also any other identifying information specific to the transaction such as alternate names or addresses.
      properties:
        address:
          discriminator:
            mapping:
              STRUCTURED: '#/components/schemas/activity_StructuredAddressV3'
              UNSTRUCTURED: '#/components/schemas/activity_UnstructuredAddressV3'
            propertyName: format
          oneOf:
          - $ref: '#/components/schemas/activity_StructuredAddressV3'
          - $ref: '#/components/schemas/activity_UnstructuredAddressV3'
        identifier:
          discriminator:
            mapping:
              COUNTERPARTY: '#/components/schemas/activity_CounterpartyPartyIdentifierV3'
              CUSTOMER: '#/components/schemas/activity_CustomerPartyIdentifierV3'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/activity_CounterpartyPartyIdentifierV3'
          - $ref: '#/components/schemas/activity_CustomerPartyIdentifierV3'
        name:
          description: The name of the party.
          example: John Doe
          maxLength: 256
          minLength: 0
          type:
          - string
          - 'null'
      type: object
    activity_ReviewDecisionRequestBody:
      properties:
        review_decision:
          description: Represents the states of review decision
          enum:
          - RELEASE
          - REJECT
          example: RELEASE
          type: string
      required:
      - review_decision
      type: object
    ol_TextEnrichmentValueV3:
      allOf:
      - $ref: '#/components/schemas/ol_EnrichmentValueV3'
      - properties:
          text:
            description: The text content.
            example: HIGH
            maxLength: 256
            minLength: 0
            type: string
        type: object
      description: String representation of the enrichment value.
      required:
      - data_type
      - text
      title: Text Value
      type: object
    search_AtmChannelV3:
