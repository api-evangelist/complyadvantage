legacy_model:
  root: Search
  description: >-
    The legacy REST API has a much smaller graph. A Search is created against a name and
    filters, returns Hits (matched entities), can be Monitored for changes, and carries
    case-management state - assignee, match status, risk level, comments and tags.
  entities: [Search, Hit, Entity, Monitor, Comment, Tag, User]
  relationships:
  - {from: Search, to: Hit, type: has_many, via: search id}
  - {from: Search, to: Monitor, type: has_one, via: search id}
  - {from: Search, to: Comment, type: has_many, via: search id}
  - {from: Search, to: Tag, type: has_many, via: search id}
  schemas: [SearchRequest, Search, Hit, SearchEnvelope, SearchListEnvelope, MonitorEnvelope]
notes: >-
  There is no cross-walk between the two models. A Search on the legacy API and a Customer
  on Mesh are different records in different systems with different identifiers; the
  contract offers no migration or lookup path between them.
