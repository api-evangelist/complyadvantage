openapi: 3.2.0
info:
  title: Mesh Customers API
  version: v2.0
servers:
- description: ComplyAdvantage Mesh API
  url: https://api.mesh.complyadvantage.com
security:
- BearerAuth: []
tags:
- name: Customers
paths:
  /v2/customers:
    get:
      description: 'This endpoint returns a list of customers that match the specified search criteria.


        The response includes partial information for each customer, including essential fields from the customer profile, risk level, and status objects.


        Complete details for each customer can be retrieved by calling the relevant endpoint with a specific customer identifier.


        This endpoint can return up to 10,000 customers. For larger datasets, use the ''exports'' endpoint, which is designed for exporting large volumes of data.


        You need the "View customers" permission to use this endpoint.'
      operationId: customerGetCustomersList
      parameters:
      - description: Search customers by name or external identifier
        example: john doe
        in: query
        name: search
        required: false
        schema:
          type: string
      - example: '2024-01-01T00:00:00.000Z'
        in: query
        name: created_at_from
        required: false
        schema:
          example: '2024-01-01T00:00:00.000Z'
          format: date-time
          type: string
      - example: '2024-12-31T23:59:59.000Z'
        in: query
        name: created_at_to
        required: false
        schema:
          example: '2024-12-31T23:59:59.000Z'
          format: date-time
          type: string
      - example: '2024-01-01T00:00:00.000Z'
        in: query
        name: updated_at_from
        required: false
        schema:
          example: '2024-01-01T00:00:00.000Z'
          format: date-time
          type: string
      - example: '2024-12-31T23:59:59.000Z'
        in: query
        name: updated_at_to
        required: false
        schema:
          example: '2024-12-31T23:59:59.000Z'
          format: date-time
          type: string
      - example: PERSON
        in: query
        name: type
        required: false
        schema:
          example: PERSON
          type: string
      - example: HIGH
        in: query
        name: risk_level
        required: false
        schema:
          example: HIGH
          type: string
      - example: ACTIVE
        in: query
        name: status
        required: false
        schema:
          example: ACTIVE
          type: string
      - example: true
        in: query
        name: monitoring_enabled
        required: false
        schema:
          example: true
          type: boolean
      - example:
        - web
        in: query
        name: acquisition_source
        required: false
        schema:
          example:
          - web
          items:
            example: '["web"]'
            type: string
          type: array
      - example:
        - segment-1
        in: query
        name: segments
        required: false
        schema:
          example:
          - segment-1
          items:
            example: '["segment-1"]'
            type: string
          type: array
      - example:
        - label-1
        in: query
        name: labels
        required: false
        schema:
          example:
          - label-1
          items:
            example: '["label-1"]'
            type: string
          type: array
      - example: -created_at
        in: query
        name: sort
        required: false
        schema:
          example: -created_at
          type: string
      - example:
        - ABC123
        in: query
        name: industry_code
        required: false
        schema:
          example:
          - ABC123
          items:
            example: '["ABC123"]'
            type: string
          type: array
      - example:
        - Description of the industry code
        in: query
        name: industry_code_description
        required: false
        schema:
          example:
          - Description of the industry code
          items:
            example: '["Description of the industry code"]'
            type: string
          type: array
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_CustomersList'
          description: Get the list of customers
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Not Found
      summary: Get a list of customers
      tags:
      - Customers
  /v2/customers/acquisition-sources:
    get:
      description: You need the "View customers" permission to use this endpoint.
      operationId: customerGetAcquisitionSources
      parameters:
      - example: web
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_PaginatedAcquisitionSourcesV2Response'
          description: Get a list of acquisition sources matching the search parameter.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Not Found
      summary: Get a list of acquisition sources matching the search parameter
      tags:
      - Customers
  /v2/customers/external/{external_identifier}:
    get:
      description: 'This endpoint returns a 308 Permanent Redirect response, directing you to the get customer endpoint based on the provided external identifier.

        Many API libraries follow the automatic redirect but, in some programming languages it may requires an additional API call.


        You need the "View customers" permission to use this endpoint.'
      operationId: customerGetCustomerV2WithExternalIdentifier
      parameters:
      - description: The unique identifier for your customer that you set when creating the customer.
        example: external_identifier
        in: path
        name: external_identifier
        required: true
        schema:
          type: string
      responses:
        '308':
          description: Permanent Redirect
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Not Found
      summary: Get customer using your identifier
      tags:
      - Customers
  /v2/customers/{customer_identifier}:
    get:
      description: 'Once the workflow status returns as COMPLETED, it is possible to collect the latest customer record.


        The response contains all the information submitted during the POST `/v2/customer` request.


        The customer-identifier can be found within the GET `/v2/workflows/` response from within the `step_output` within the `customer-creation` step.


        There is a number of customer statuses that can be returned from this endpoint:


        | Status name | Description |

        | ------ | ------ |

        |Processing| The customer has been created successfully but there are parts of the create-and-screen workflow that are still in progress|

        |Active|The customer is active - the initial risk level is not prohibited and there are no onboarding screening results, or these results were returned and their case status is accepted|

        |Closed|The customer is closed - the initial risk level is prohibited, or there are screening results and the case status is rejected, or maybe the client closed this customer for another reason.|


        You need the "View customers" permission to use this endpoint.'
      operationId: customerGetCustomerV2
      parameters:
      - description: The unique identifier we provided when you created the customer.
        example: 00000000-0000-0000-0000-000000000000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_CustomerV2'
          description: Get a customer.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: The customer doesn't exist.
      summary: Get customer details
      tags:
      - Customers
  /v2/customers/{customer_identifier}/cases:
    get:
      description: 'Returns a paginated list of cases associated with a customer.


        You need one of the "View cases (customer onboarding)", "View cases (customer monitoring)", "View cases (payment screening)" or "View cases (transaction monitoring)" permissions to use this endpoint.'
      operationId: casesService/v2/customers/customer_identifier/cases.get
      parameters:
      - description: The unique identifier of the customer.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format of: `[-]property` (`-` descending modifier).


          * Default sort order is ascending (without `-`).


          * Multiple sort criteria are supported.'
        example:
        - -timestamp
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_PaginatedResponseCaseResponse'
          description: OK
      summary: Retrieve cases for a customer
      tags:
      - Customers
  /v2/customers/{customer_identifier}/monitor:
    get:
      description: 'This endpoint returns the monitor status for a single customer.


        You need the "View customer monitoring status" permission to use this endpoint.'
      operationId: customerGetMonitoringConfig
      parameters:
      - description: The unique identifier we provided when you created the customer.
        example: 00000000-0000-0000-0000-000000000000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_CustomerMonitoringData'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Not Found
      summary: Get monitoring configuration of a customer
      tags:
      - Customers
    patch:
      description: 'This endpoint allows you to set the monitoring configuration for a single customer.


        You need "Access to base customer monitoring functionality" enabled and the "Monitor and unmonitor customers" permission to use this endpoint.'
      operationId: customerUpdateCustomerMonitorConfiguration
      parameters:
      - description: The unique identifier we provided when you created the customer.
        example: 00000000-0000-0000-0000-000000000000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customer-manager_CustomerMonitoringDataApi'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_CustomerMonitoringData'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Not Found
      summary: Update monitoring configuration for an existing customer
      tags:
      - Customers
  /v2/customers/{customer_identifier}/notes:
    get:
      description: 'This endpoint returns a paginated list of notes on a customer.


        You need the "View customers" permission to use this endpoint.'
      operationId: customerGetCustomerNotes
      parameters:
      - description: The unique identifier of the exiting customer.
        example: 00000000-0000-0000-0000-000000000000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_PaginatedCustomerNotesResponse'
          description: Successfully retrieved customer notes.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Not Found
      summary: Get a list of notes on a customer
      tags:
      - Customers
    post:
      description: 'This endpoint enables you to create a note on a customer.


        You need the "Update customers" permission to use this endpoint.'
      operationId: customerCreateCustomerNote
      parameters:
      - description: The unique identifier we provided when you created the customer.
        example: 123e4567-e89b-12d3-a456-426614174000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customer-manager_CreateCustomerNoteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Successful Response:
                  description: Successful Response
                  value:
                    contents: Customer contacted regarding account verification.
                    created_at: '2024-01-15T10:30:00.000Z'
                    created_by: 987fcdeb-51a2-43f1-b123-456789abcdef
                    identifier: 123e4567-e89b-12d3-a456-426614174000
                    type: CUSTOMER
              schema:
                $ref: '#/components/schemas/customer-manager_CreateCustomerNoteResponse'
          description: Customer Note created successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Not Found.
      summary: Create note on a customer
      tags:
      - Customers
  /v2/customers/{customer_identifier}/products:
    get:
      description: 'This endpoint returns a list of the latest product information for a single customer.


        You need the "View customers" permission to use this endpoint.'
      operationId: customerGetProductsV2
      parameters:
      - description: The unique identifier we provided when you created the customer.
        example: 00000000-0000-0000-0000-000000000000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_PaginatedProductsV2Response'
          description: Get a customers products.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer-manager_ProblemDetailErrorResponse'
          description: The customer doesn't exist.
      summary: Get customer's products
      tags:
      - Customers
  /v2/customers/{customer_identifier}/reports:
    post:
      description: 'Calling this endpoint will return a download URL to a screening certificate for a specific customer. When the response is 201, it means the screening certificate is generated successfully, and can be downloaded from the link returned. When the response is 200, it indicates that the data for the certificate is not yet available and you should try again shortly.


        You need the "View customers" permission to use this endpoint.'
      operationId: screeningCertificatesServiceAPIPostReportsV2
      parameters:
      - description: The unique identifier we provided when you created the customer.
        example: 00000000-0000-0000-0000-000000000000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/cert_ReportsRequest'
              type: array
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                first: /v2/customers/44444444-4444-4444-4444-444444444444/reports?page_number=1
                next: null
                prev: null
                reports:
                - created_at: '1970-01-01T00:00:00.012Z'
                  created_by: 55555555-5555-5555-5555-555555555555
                  expires_at: '1970-01-01T00:00:00.012Z'
                  report_type: SCREENING_REPORT
                  status: NOT_READY
                self: /v2/customers/44444444-4444-4444-4444-444444444444/reports
                total_count: 1
          description: The customer report is not ready, please try again later.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cert_PaginatedResponseReport'
          description: The customer report has been generated successfully.
        '400':
          content:
            application/json:
              example:
                detail: There were validation errors with your request
                identifier: 018e1971-1c6f-761f-a510-43540727ff48
                instance: https://v2/customers/56fb9e63-de1b-4cbc-9e7e-c5e15391eb09/reports
                properties:
                  errors:
                  - field: report_type
                    reasons:
                    - key: report_type
                      message: SOME_OTHER_REPORT is not a valid report type
                      parameters: null
                    rejected: SOME_OTHER_REPORT
                status: 400
                timestamp: '2024-03-07T15:03:47.055Z'
                title: Invalid JSON Request
                type: about:blank
              schema:
                $ref: '#/components/schemas/cert_ProblemDetailErrorResponse'
          description: Bad request.
        '403':
          content:
            application/json:
              example:
                detail: You do not have the permissions needed to access the resource.
                identifier: 018d3157-0ec8-73ba-a684-865e5e2ff1ed
                instance: https://v2/customers/56fb9e63-de1b-4cbc-9e7e-c5e15391eb09/reports
                properties: {}
                status: 403
                timestamp: '2024-01-22T13:23:25.512Z'
                title: Forbidden
                type: about:blank
              schema:
                $ref: '#/components/schemas/cert_ProblemDetailErrorResponse'
          description: Invalid permissions.
        '404':
          content:
            application/json:
              example:
                detail: Customer for account 0190b67d-df91-79ac-a60f-2c985e85630e with identifier 0190b67d-a943-79e0-a520-fdb6dbcf93bb not found
                identifier: 018d3157-0ec8-73ba-a684-865e5e2ff1ed
                instance: https://v2/customers/0190b67d-a943-79e0-a520-fdb6dbcf93bb/reports
                properties: {}
                status: 404
                timestamp: '2024-01-22T13:23:25.512Z'
                title: Customer not found
                type: about:blank
              schema:
                $ref: '#/components/schemas/cert_ProblemDetailErrorResponse'
          description: The customer doesn't exist.
      summary: Generate a screening certificate for a specific customer
      tags:
      - Customers
  /v2/customers/{customer_identifier}/scores:
    get:
      description: 'This endpoint returns the latest risk score for a customer. It includes the overall score and level as well as a breakdown of the score by category.


        You need the "View customers" permission to use this endpoint.'
      operationId: riskScoringManagerServiceAPIGetRiskScore
      parameters:
      - description: The unique identifier we provided when you created the customer.
        example: 00000000-0000-0000-0000-000000000000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: Optional field to sort risk models by.
        example: created_at
        in: query
        name: sort
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/risk-scoring_RiskScore'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/risk-scoring_ProblemDetailErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/risk-scoring_ProblemDetailErrorResponse'
          description: Not Found
      summary: Get customer's risk score
      tags:
      - Customers
    patch:
      description: 'Manually override the overall risk score level for a customer. Once overridden, the risk score type is set to MANUAL and will not be automatically recalculated by the system. The manual override persists until explicitly changed again through this endpoint or removed.


        You need the "Update customers" permission to use this endpoint.'
      operationId: riskScoringManagerServiceAPIUpdateRiskScore
      parameters:
      - description: The unique identifier we provided when you created the customer.
        example: 00000000-0000-0000-0000-000000000000
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/risk-scoring_RiskScoreOverrideRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Manual Risk Score:
                  description: Manual Risk Score
                  value:
                    category_results: []
                    created_at: '2025-09-12T09:18:23.529Z'
                    customer_identifier: 01985c02-690f-7f0e-95ce-0dec29e985ff
                    customer_version: 1
                    overall_result:
                      level: LOW
                      score: 0
                    override_reason: Some detailed reason
                    risk_model_identifier: 01985c02-690f-7f0e-95ce-0dec29e985ff
                    risk_model_version: 1
                    score_identifier: 01993d37-fd29-70f6-bb67-391347164c97
                    type: MANUAL
                    updated_at: '2025-09-12T09:18:23.529Z'
                    updated_by: 01985c02-690f-7f0e-95ce-0dec29e985ff
              schema:
                $ref: '#/components/schemas/risk-scoring_RiskScore'
          description: Successfully overridden the customer's risk score level.
        '400':
          content:
            application/json:
              examples:
                Invalid Risk Level:
                  description: Invalid Risk Level
                  value:
                    detail: Missing or invalid risk level or override reason values
                    identifier: 018e1971-1c6f-761f-a510-43540727ff48
