openapi: 3.2.0
info:
  title: Mesh Onboarding API
  version: v2.0
servers:
- description: ComplyAdvantage Mesh API
  url: https://api.mesh.complyadvantage.com
security:
- BearerAuth: []
tags:
- name: Onboarding
paths:
  /v2/workflows/create-and-screen:
    post:
      description: 'This endpoint initiates the ''create and screen'' workflow for your customer in **asynchronous mode**. The workflow consists of five steps:

        1. **Customer Record Creation:** The Customer Record is created in Mesh.

        2. **Risk Scoring:** An initial Risk Score is calculated for the Customer.

        3. **Customer Screening:** The Customer is screened using settings based on the Calculated Risk Score.

        4. **Alerts:** Alerts associated with the screened customer are generated based on the risk analysis.

        5. **Case Creation:** Create cases based on the result of customer screening and alerts, for an analyst to review. Each customer must have a unique customer external identifier specified as part of the request. This identifier is used to find the customer within Mesh and link back to your own internal systems. The customer can be one of: `PERSON`, `COMPANY`, `` or `UNDEFINED` and can optionally have multiple `products`. Following risk scoring, the customer will be screened using ComplyAdvantage''s AML database. You can specify the screening profile used for initial screening and subsequent ongoing monitoring within the `configuration` object. The value for `screening_profile_identifier` can be found in the settings section of the Mesh application. The workflow will execute asynchronously. The initial POST returns a ''workflow-instance-identifier'' and you can be notified of completion by: * either polling the GET `/workflows/` endpoint with the `workflow_identifier` returned when starting the workflow * or, setting up a `WORKFLOW_COMPLETED` webhook that will fire when your workflow completes. You need "Access to base customer screening functionality" enabled and the "Create and screen customers" permission to use this endpoint.'
      operationId: createCustomerAndScreenAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ol_CreateAndScreenCustomerRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                Async workflow created:
                  description: Async workflow created, workflow instance identified returned.
                  value:
                    workflow_instance_identifier: 018d30ec-9485-7146-9444-e52486fae1bb
              schema:
                $ref: '#/components/schemas/ol_AsyncWorkflowResponse'
          description: Workflow executed
        '400':
          content:
            application/json:
              examples:
                Validation error:
                  description: Validation error
                  value:
                    detail: Customer object is missing from request
                    identifier: 018e1971-1c6f-761f-a510-43540727ff48
                    instance: https://example/v2/workflows/create-and-screen
                    properties:
                      errors: []
                    status: 400
                    timestamp: '2024-03-07T15:03:47.055Z'
                    title: Invalid JSON Request
                    type: about:blank
              schema:
                $ref: '#/components/schemas/ol_ProblemDetailErrorResponse'
          description: Bad request
      summary: Create and Screen a Customer asynchronously
      tags:
      - Onboarding
  /v2/workflows/sync/create-and-screen:
    post:
      description: 'This endpoint initiates the ''create and screen'' workflow for your customer in **synchronous mode**. The workflow consists of five steps:

        1. **Customer Record Creation:** The Customer Record is created in Mesh.

        2. **Risk Scoring:** An initial Risk Score is calculated for the Customer.

        3. **Customer Screening:** The Customer is screened using settings based on the Calculated Risk Score.

        4. **Alerts:** Alerts associated with the screened customer are generated based on the risk analysis.

        5. **Case Creation:** Create cases based on the result of customer screening and alerts, for an analyst to review. Each customer must have a unique customer external identifier specified as part of the request. This identifier is used to find the customer within Mesh and link back to your own internal systems. The customer can be one of: `PERSON`, `COMPANY`, `` or `UNDEFINED` and can optionally have multiple `products`. Following risk scoring, the customer will be screened using ComplyAdvantage''s AML database. You can specify the screening profile used for initial screening and subsequent ongoing monitoring within the `configuration` object. The value for `screening_profile_identifier` can be found in the settings section of the Mesh application. The workflow executes synchronously up to customer screening, returning the workflow status. This end-point is currently idempotent: in case of downstream error you can re-send the exact same request, and the workflow will be retried. To screen an entity:

        - Exactly one of `full_name` or `last_name` must be provided (not both, not neither).

        - When using `last_name`: `title`, `first_name`, `middle_name`, `last_name`, `fathers_name`, `mothers_name`, and `suffix` are optional.

        - When using `full_name`: `title`, `first_name`, `middle_name`, `last_name`, `fathers_name`, `mothers_name`, and `suffix` must all be omitted. By default, the screen customer request is done synchronously only until the screening workflow step and returns hit/no hits in `step_details.customer-screening.step_output.screening_result`. `last_sync_step` query parameter can be set to `ALERTING` to additionally wait for the alerting workflow step. The advantage of this option is that alert identifiers are included in the response in `step_details.alerting.step_output.alerts[].identifier`. You need "Access to base customer screening functionality" enabled and the "Create and screen customers" permission to use this endpoint.'
      operationId: createCustomerAndScreenSync
      parameters:
      - description: '- SCREENING (default): faster response, synchronous execution stops after screening; response only reflects hit/no-hit status — alert_identifiers will not be present in the response.

          - ALERTING: slower response, synchronous execution continues through the alerting step; required to receive alert_identifiers in the response. Remaining steps (case-creation) continue asynchronously after the response is returned.'
        example: ALERTING
        in: query
        name: last_sync_step
        required: false
        schema:
          default: SCREENING
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ol_CreateAndScreenCustomerRequest'
        required: true
