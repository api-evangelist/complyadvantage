      - CARD_PAYMENT
      - REMITTANCE
      - CRYPTO
      example: BANK_PAYMENT
      type: string
    search_MonetaryValueV3:
      description: Represents a combination of a decimal amount with a currency.
      properties:
        amount:
          description: The decimal amount/value.
          example: 10.02
          type: number
        crypto_asset:
          $ref: '#/components/schemas/search_CryptoAssetV3'
        currency:
          description: 3 letter currency code as defined by ISO-4217.
          example: EUR
          format: iso-4217
          maxLength: 3
          minLength: 3
          type:
          - string
          - 'null'
      required:
      - amount
      type: object
    search_BankV3:
      description: Represents a bank's details.
      properties:
        bic:
          description: The Business Identifier Code (BIC) of the bank. Also known as SWIFT code.
          example: ABCDGB01A1B
          pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
          type:
          - string
          - 'null'
        legal_entity_address:
          $ref: '#/components/schemas/search_StructuredAddressV3'
        name:
          description: The name of the bank.
          example: Deutsche Bank
          maxLength: 256
          minLength: 0
          type:
          - string
          - 'null'
      type: object
    search_TransactionV3:
      description: Represents a Transaction performed by a Customer. A Transaction can be either monetary or non-monetary.
      properties:
        custom_fields:
          description: A list of custom fields attached to the Transaction.
          items:
            $ref: '#/components/schemas/search_CustomFieldV3'
          maxItems: 10
          minItems: 0
          type:
          - array
          - 'null'
        customer_external_identifier:
          description: Your unique identifier for customer that the Transaction is associated with. We will populate this after mapping your customer identifier to ours as we process your Transaction.
          example: MyUniqueCustomerReference
          maxLength: 512
          minLength: 0
          type: string
        customer_identifier:
          description: Our unique identifier for customer that the Transaction is associated with. We will populate this after mapping your customer identifier to ours as we process your Transaction.
          example: 0195fb35-4793-7bb5-8042-e4371640d176
          format: uuid
          readOnly: true
          type: string
        details:
          discriminator:
            mapping:
              MONETARY: '#/components/schemas/search_MonetaryTransactionClassificationDetailsV3'
            propertyName: classification
          oneOf:
          - $ref: '#/components/schemas/search_MonetaryTransactionClassificationDetailsV3'
        enrichments:
          description: A list of enrichments applied to the Transaction.
          items:
            $ref: '#/components/schemas/search_EnrichmentV3'
          readOnly: true
          type:
          - array
          - 'null'
        evaluation_outcome:
          description: The combined outcome of all transaction evaluations.
          enum:
          - PENDING
          - PROCESS
          - ALLOW
          - HOLD
          - ERROR
          readOnly: true
          type: string
        external_identifier:
          description: Your unique identifier for the Transaction. You will use this to reference the Transaction within our systems. This cannot be changed after submitting the Transaction.
          example: MyUniqueIdentifier
          maxLength: 512
          minLength: 0
          type: string
        identifier:
          description: Our unique identifier for your Transaction. We generate this when we process your Transaction and you are not able to specify it.
          format: uuid
          readOnly: true
          type:
          - string
          - 'null'
        initiating_channel:
          discriminator:
            mapping:
              ATM: '#/components/schemas/search_AtmChannelV3'
              DEVICE: '#/components/schemas/search_DeviceChannelV3'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/search_AtmChannelV3'
          - $ref: '#/components/schemas/search_DeviceChannelV3'
        occurred_at:
          description: The timestamp of the Transaction. This is the timestamp you want us to use as this transactions position in time for the purposes of risk analysis. This timestamp can contain offset information.
          example: '2025-04-03T03:32:00.000Z'
          format: date-time
          type: string
        product:
          discriminator:
            mapping:
              LOAN: '#/components/schemas/search_LoanProductV3'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/search_LoanProductV3'
        received_at:
          description: The timestamp the Transaction event was received by us.
          example: '2025-04-03T11:32:00.000Z'
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        regulatory_reporting_details:
          $ref: '#/components/schemas/search_RegulatoryReportDetailsV3'
        review_decision:
          description: Represents the states of review decision
          enum:
          - NOT_APPLICABLE
          - NOT_REVIEWED
          - RELEASE
          - REJECT
          readOnly: true
          type: string
        version:
          description: The version of the transaction.
          example: 3
          format: int32
          minimum: 1
          readOnly: true
          type: integer
      required:
      - customer_external_identifier
      - customer_identifier
      - details
      - evaluation_outcome
      - external_identifier
      - occurred_at
      - review_decision
      - version
      type: object
    activity_CardHolderV3:
      description: Represents a card holder with party identification details and onboarding information.
      properties:
        details:
          $ref: '#/components/schemas/activity_PartyIdentificationV3'
      type: object
    search_GeographicCoordinatesV3:
      description: Geographic location represented by the latitude and longitude.
      properties:
        latitude:
          description: 'The angular distance north or south of the Earth''s equator, measured in degrees. Valid range: -90 to +90, where negative values represent southern latitudes and positive values represent northern latitudes.'
          example: -34.603722
          maximum: 90
          minimum: -90
          type: number
        longitude:
          description: 'The angular distance east or west of the prime meridian, measured in degrees. Valid range: -180 to +180, where negative values represent western longitudes and positive values represent eastern longitudes.'
          example: 148.516389
          maximum: 180
          minimum: -180
          type: number
      required:
      - latitude
      - longitude
      type: object
    search_PointOfSaleConditionV3:
      description: Contains contextual information about the card payment environment.
      properties:
        condition:
          $ref: '#/components/schemas/search_PointOfSaleConditionCodeV3'
        entry_mode:
          $ref: '#/components/schemas/search_PointOfSaleEntryModeV3'
      type: object
