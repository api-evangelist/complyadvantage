            - $ref: '#/components/schemas/search_StructuredAddressV3'
            - $ref: '#/components/schemas/search_UnstructuredAddressV3'
          geographic_location:
            $ref: '#/components/schemas/search_GeographicCoordinatesV3'
          identifier:
            description: Client-specific identifier for ATM.
            type: string
          provider:
            description: ATM provider name.
            type: string
        type: object
