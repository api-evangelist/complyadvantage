specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: ComplyAdvantage
providerId: complyadvantage
generated: '2026-08-27'
method: searched
source: >-
  https://docs.complyadvantage.com/api-docs (legacy REST numeric limits and backoff policy)
  and https://docs.mesh.complyadvantage.com/docs/rate-limiting (Mesh headers and 429 body)
created: '2026-07-11'
modified: '2026-08-27'
reconciled: true
tags:
- Anti-Money Laundering
- AML
- Sanctions Screening
- Compliance
- Rate Limiting
- Quotas
description: >-
  ComplyAdvantage documents explicit numeric rate limits for its REST API.
  Standard contracts allow 600 API calls per minute; sandbox accounts are
  limited to 300 calls per minute. Higher limits can be configured on request
  through your account manager. Exceeding the limit returns HTTP 429 Too Many
  Requests, and the documentation prescribes an exponential backoff retry
  strategy starting at 2 seconds, doubling on each attempt, and capped at 60
  seconds. In addition to the request-rate cap, search creation is paginated
  at up to 100 results per request via offset and limit parameters.
notes: >-
  Limits apply per account across the regional bases (EU, US, APAC). Rate
  limits on the newer Mesh platform API are documented separately in the Mesh
  rate-limiting guide.
sources:
- https://docs.complyadvantage.com/
- https://docs.complyadvantage.com/api-docs/
- https://docs.mesh.complyadvantage.com/
responseCodes:
  throttled: 429
limits:
- name: Standard Contract API Requests
  scope: account
  metric: requests
  limit: 600 per minute
  notes: Default cap for standard contracts; higher limits configurable via your account manager.
- name: Sandbox API Requests
  scope: account
  metric: requests
  limit: 300 per minute
  notes: Cap for sandbox accounts used during integration and testing.
- name: Search Results Per Request
  scope: request
  metric: results
  limit: 100
  notes: Creating a search returns up to 100 results; paginate with offset and limit for more.
- name: Common Pagination Depth
  scope: request
  metric: records
  limit: 10000
  notes: >-
    Mesh caps a customer list at 10,000 records; beyond that the documentation directs you
    to the exports endpoints. Recorded from the Mesh customer-list reference, not observed.
policies:
- name: Exponential Backoff
  description: On 429 responses, retry with exponential backoff starting at 2 seconds, doubling each attempt, with a maximum backoff of 60 seconds.
- name: Configurable Limits
  description: Higher request-rate limits can be arranged on standard contracts by contacting your ComplyAdvantage account manager.
- name: Webhook Delivery
  description: Match, search, and monitoring updates can be received via webhooks (match_status_updated, search_status_updated, monitored_search_updated) instead of polling, reducing request volume.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
mesh:
  api: ComplyAdvantage Mesh Platform API
  base: https://api.mesh.complyadvantage.com
  docs: https://docs.mesh.complyadvantage.com/docs/rate-limiting
  published_numbers: >-
    None. "Please contact your account manager to confirm the rate limits you have in place
    for your account." The numeric limits are per-contract and not public.
  status_on_exhaustion: 429
  body_on_exhaustion: '{"message": "API rate limit exceeded"}'
  envelope_note: >-
    The 429 body does NOT use the RFC 9457 problem+json envelope the rest of the Mesh API
    uses. A client that parses every error as problem+json breaks exactly when throttled.
  response_headers:
  - name: Ratelimit-Limit
    description: The total allowed number of requests in the time window.
  - name: Ratelimit-Remaining
    description: The number of requests remaining in the time window.
  - name: Ratelimit-Reset
    description: The time remaining, in seconds, until the quota is reset.
  agent_note: >-
    Because no numbers are published, these three headers are the ONLY source of truth for a
    Mesh client. Read them on every response and drive backoff from Ratelimit-Reset rather
    than from a fixed schedule. The legacy REST API, by contrast, publishes numbers (600/min
    standard, 300/min sandbox) but returns no rate-limit headers at all - the two APIs are
    exact opposites on this.
