raw_tools_list: complyadvantage-mcp-tools.json
notes: >-
  This server is generated by the ReadMe documentation platform that hosts
  docs.mesh.complyadvantage.com; ComplyAdvantage publishes no hand-authored MCP server and
  does not document this endpoint in its own guides. It is nonetheless served from a host
  ComplyAdvantage controls, is anonymous, and is reachable by an agent right now, so it is
  recorded as a real remote MCP surface with that provenance stated. The legacy REST API
  (api.complyadvantage.com) has no MCP server; its docs host, docs.complyadvantage.com, is
  a static Slate site and returns 403 for /mcp.
