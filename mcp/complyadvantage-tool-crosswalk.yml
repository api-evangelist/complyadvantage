crosswalk:
- tool: execute-request
  category: execution
  rest:
  - '*'
  binding: passthrough
  confidence: high
  note: >-
    Takes a HAR request object and forwards it, so its effective REST binding is every
    operation in openapi/complyadvantage-mesh-api-openapi.json - all 163, spanning
    Authentication, Onboarding, Customers, Cases, Alerts & Risks, Webhooks, Exports,
    Email Configurations, Lookup Lists, Audit, Transactions, Custom Lists, Screening
    Configurations, Regulatory Reports, IAM and Batch Processing. Its inputSchema is a
    single harRequest object, so it inherits NO per-operation parameters or requestBody -
    the agent must construct the request itself from get-endpoint output. It carries the
    write surface: createCustomerAndScreenSync, customerTransitionCustomerStatus,
    riskScoringManagerServiceAPIUpdateRiskScore,
    activityStorePostTransactionReviewDecision and every DELETE in the spec are all
    reachable through this one tool.
- tool: get-endpoint
  category: introspection
  rest: []
  binding: spec-read
  confidence: high
  note: >-
    Reads one path+method out of the OpenAPI, including security schemes and servers. It
    calls no API operation; it is the spec-side substitute for the per-operation
    inputSchema that execute-request does not carry.
- tool: list-endpoints
  category: introspection
  rest: []
  binding: spec-read
  confidence: high
  note: Enumerates all 163 paths and methods with summaries. No API call.
- tool: search-endpoints
  category: introspection
  rest: []
  binding: spec-read
  confidence: high
  note: Full-text search across paths, operations and parameters. No API call.
mcp_only:
