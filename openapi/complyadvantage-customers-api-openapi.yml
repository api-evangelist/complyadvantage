    case-management_CaseResponse:
      description: Case result detail.
      properties:
        assignee:
          description: "User unique identifier that is currently assigned to case.\n\n null if un-assigned."
          format: uuid
          type:
          - string
          - 'null'
        created_at:
          description: Case created date and time.
          format: date-time
          type: string
        customer:
          $ref: '#/components/schemas/case-management_CaseCustomerSummaryResponse'
