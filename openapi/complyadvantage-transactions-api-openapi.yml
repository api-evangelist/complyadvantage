      - BUSINESS_INCOME
      - SAVINGS
      - INVESTMENTS
      - PENSION
      - LOAN
      - GIFT
      - INHERITANCE
      - ASSET_SALE
      - INSURANCE_PAYOUT
      - GOVERNMENT_BENEFITS
      - TRUST_DISTRIBUTION
      - CRYPTO_LIQUIDATION
      - CROWDFUNDING
      - GAMBLING_WINNINGS
      - OTHER
