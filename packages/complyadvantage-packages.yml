description: >-
  ComplyAdvantage published three first-party API client libraries in 2014 - a Python
  package, a Ruby gem, and a PHP Composer package - all wrapping the original
  "sanctions API". None has had a release since 2014, the PHP package is flagged
  abandoned on Packagist, and every one of the three GitHub repositories they name as
  their source has been removed from the ComplyAdvantage organization (404). The
  company ships no client library for the current REST API (api.complyadvantage.com)
  and none for the Mesh platform API (api.mesh.complyadvantage.com, v2/v3, 163
  operations). The supported integration path published today is the OpenAPI schema
  plus a forkable Postman collection, not an SDK.
notes: >-
  This is the strongest decay signal in the repo: the newest first-party client release
  is 2014-10-16, twelve years older than the Mesh API it would have to wrap. Treat all
  three as historical. npm, NuGet, pkg.go.dev and crates.io carry no first-party
  ComplyAdvantage package - the single npm search hit (@tradle/conf) is a third-party
  Tradle CLI, not a ComplyAdvantage library.
