provider: ComplyAdvantage
providerId: complyadvantage
description: >-
  ComplyAdvantage's MCP surface does not project business capabilities as named tools. It
  projects the OpenAPI document itself: three introspection tools plus one generic
  executor. That means the tool-to-operation binding is not one-to-one but one-to-all -
  execute-request can invoke any of the 163 Mesh operations, and the other three tools
  read the spec rather than the API. The practical consequence for an agent is that it
  gets the whole Mesh API through a single tool with no per-operation affordances,
  descriptions, or guardrails: consequence, reversibility and required permissions are
  invisible at the tool layer and have to be recovered from the spec via get-endpoint.
