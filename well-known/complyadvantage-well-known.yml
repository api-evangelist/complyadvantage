provider: ComplyAdvantage
providerId: complyadvantage
description: >-
  One real hit across five hosts: the Mesh documentation host serves an RFC 9727
  /.well-known/api-catalog as application/linkset+json, pointing at the Mesh OpenAPI
  (mesh-api.json) as service-desc and the API reference as service-doc. No security.txt
  anywhere, no OpenID/OAuth discovery document (the login flow runs on AWS Cognito at
  auth.complyadvantage.com, which answers 404 for all three discovery paths), no
  ai-plugin.json, and no A2A agent card on any host.
notes: >-
  api.complyadvantage.com answers 401 for every path including /.well-known/* - the
  gateway authenticates before routing, so absence there is unprovable rather than
  proven. api.mesh.complyadvantage.com behaves the same way with an
  application/problem+json 401. docs.complyadvantage.com is an S3-backed Slate site that
  returns an XML AccessDenied 403 for anything it does not have. complyadvantage.com and
  docs.mesh.complyadvantage.com return HTML 404 shells - recorded as misses, not
  documents.
