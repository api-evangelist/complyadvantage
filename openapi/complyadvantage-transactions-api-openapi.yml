    ol_TransactionV3:
      description: Represents a Transaction performed by a Customer. A Transaction can be either monetary or non-monetary.
      properties:
        custom_fields:
          description: A list of custom fields attached to the Transaction.
          items:
            $ref: '#/components/schemas/ol_CustomFieldV3'
          maxItems: 10
          minItems: 0
          type:
          - array
          - 'null'
        customer_external_identifier:
          description: Your unique identifier for customer that the Transaction is associated with. We will populate this after mapping your customer identifier to ours as we process your Transaction.
          example: MyUniqueCustomerReference
          maxLength: 512
          minLength: 0
          type: string
        customer_identifier:
          description: Our unique identifier for customer that the Transaction is associated with. We will populate this after mapping your customer identifier to ours as we process your Transaction.
          example: 0195fb35-4793-7bb5-8042-e4371640d176
          format: uuid
          readOnly: true
          type: string
        details:
          discriminator:
            mapping:
              MONETARY: '#/components/schemas/ol_MonetaryTransactionClassificationDetailsV3'
            propertyName: classification
          oneOf:
          - $ref: '#/components/schemas/ol_MonetaryTransactionClassificationDetailsV3'
        enrichments:
          description: A list of enrichments applied to the Transaction.
          items:
            $ref: '#/components/schemas/ol_EnrichmentV3'
          readOnly: true
          type:
          - array
          - 'null'
        evaluation_outcome:
          description: The combined outcome of all transaction evaluations.
          enum:
          - PENDING
          - PROCESS
          - ALLOW
          - HOLD
          - ERROR
          readOnly: true
          type: string
        external_identifier:
          description: Your unique identifier for the Transaction. You will use this to reference the Transaction within our systems. This cannot be changed after submitting the Transaction.
          example: MyUniqueIdentifier
          maxLength: 512
          minLength: 0
          type: string
        identifier:
          description: Our unique identifier for your Transaction. We generate this when we process your Transaction and you are not able to specify it.
          format: uuid
          readOnly: true
          type:
          - string
          - 'null'
        initiating_channel:
          discriminator:
            mapping:
              ATM: '#/components/schemas/ol_AtmChannelV3'
              DEVICE: '#/components/schemas/ol_DeviceChannelV3'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/ol_AtmChannelV3'
          - $ref: '#/components/schemas/ol_DeviceChannelV3'
        occurred_at:
          description: The timestamp of the Transaction. This is the timestamp you want us to use as this transactions position in time for the purposes of risk analysis. This timestamp can contain offset information.
          example: '2025-04-03T03:32:00.000Z'
          format: date-time
          type: string
        product:
          discriminator:
            mapping:
              LOAN: '#/components/schemas/ol_LoanProductV3'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/ol_LoanProductV3'
        received_at:
          description: The timestamp the Transaction event was received by us.
          example: '2025-04-03T11:32:00.000Z'
          format: date-time
          readOnly: true
          type:
          - string
          - 'null'
        regulatory_reporting_details:
          $ref: '#/components/schemas/ol_RegulatoryReportDetailsV3'
        review_decision:
          description: Represents the states of review decision
          enum:
          - NOT_APPLICABLE
          - NOT_REVIEWED
          - RELEASE
          - REJECT
          readOnly: true
          type: string
        version:
          description: The version of the transaction.
          example: 3
          format: int32
          minimum: 1
          readOnly: true
          type: integer
      required:
      - customer_external_identifier
      - customer_identifier
      - details
      - evaluation_outcome
      - external_identifier
      - occurred_at
      - review_decision
      - version
      type: object
    activity_RemittanceServiceProviderTypeV3:
      description: The type of service provider facilitating the remittance transaction.
      enum:
      - TRADITIONAL_BANK
      - MONEY_TRANSFER_OPERATOR
      - DIGITAL_PLATFORM
      - ONLINE_PAYMENT_SERVICE
      - MOBILE_MONEY_SERVICE
      - CRYPTOCURRENCY_PLATFORM
      - NEOBANK
      - OTHER
      example: MONEY_TRANSFER_OPERATOR
      type: string
    ol_BooleanEnrichmentValueV3:
      allOf:
      - $ref: '#/components/schemas/ol_EnrichmentValueV3'
      - properties:
          boolean:
            description: The boolean value
            example: true
            type: boolean
        type: object
      description: Boolean representation of the enrichment value.
      required:
      - boolean
      - data_type
      title: Boolean Value
      type: object
    ol_EvaluationResultDTO:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ol_EvaluationErrorDTO'
          type: array
        outcome:
          enum:
          - PROCESS
          - ALLOW
          - HOLD
          - REJECT
          - UNKNOWN
          - ERROR
          - PENDING
          type: string
        scenario_evaluations:
          items:
            $ref: '#/components/schemas/ol_ScenarioConfigurationEvaluationDTO'
          type: array
          uniqueItems: true
        screening_evaluation_results:
          $ref: '#/components/schemas/ol_TransactionScreeningEvaluationDTO'
      required:
      - errors
      - outcome
      - scenario_evaluations
      type: object
    activity_TransactionClassificationV3:
      description: Classifies a transaction as a specific high-level class of transaction.
      enum:
      - MONETARY
      example: MONETARY
      type: string
    activity_FincenCashTransactionSubtype:
      description: Defines the subtype of FinCEN transactions.
      enum:
      - DEPOSIT
      - PAYMENT
      - CURRENCY_TRANSFER_OUT
      - NEGOTIABLE_INSTRUMENT_PURCHASE
      - CURRENCY_EXCHANGE
      - CURRENCY_TO_PREPAID_ACCESS
      - GAMING_INSTRUMENT_PURCHASE
      - CURRENCY_WAGER
      - BILLS_INSERTED_INTO_GAMING_DEVICES
      - WITHDRAWAL
      - ADVANCE_ON_CREDIT
      - CURRENCY_TRANSFER_IN
      - NEGOTIABLE_INSTRUMENT_CASHED
      - CURRENCY_FROM_PREPAID_ACCESS
      - GAMING_INSTRUMENT_REDEMPTION
      - PAYMENT_ON_WAGER
      - TRAVEL_COMPLIMENTARY_EXPENSES
      - PROMOTION_PAYMENT
      - OTHER
      example: PAYMENT
      type:
      - string
      - 'null'
