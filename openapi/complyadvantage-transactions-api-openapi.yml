    activity_RemittanceServiceProviderV3:
      description: Represents a remittance service provider's details.
      properties:
        identifier:
          description: The unique identifier for the remittance service provider.
          example: RSP-12345
          maxLength: 256
          minLength: 0
          type:
          - string
          - 'null'
        name:
          description: The name of the remittance service provider.
          example: Western Union
