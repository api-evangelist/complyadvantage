provider: ComplyAdvantage
providerId: complyadvantage
name: ComplyAdvantage Mesh Documentation MCP Server
description: >-
  ComplyAdvantage serves a live, anonymous, remote MCP server from its own Mesh
  documentation host. It is a spec-introspection server rather than a business-capability
  server: the four tools let an agent enumerate, inspect and search the 163 operations of
  the Mesh OpenAPI, and then execute any one of them via a HAR request object. That last
  tool, execute-request, makes it a real call surface for the whole Mesh API - the agent
  supplies its own Bearer token inside the HAR request, so the MCP server itself needs no
  credentials while the API calls it forwards still do.
deployment:
  mode: remote
  endpoint: https://docs.mesh.complyadvantage.com/mcp
  install: null
  package: null
  auth: none
  verified: probed
  note: >-
    Probed anonymously on 2026-08-27 and returned the full tool list with input schemas -
    no OAuth challenge, no invalid_token. Transport is Streamable HTTP with an SSE
    response (text/event-stream). No stdio package is published on npm or PyPI, and
    mcp.complyadvantage.com does not resolve, so this is remote-only.
transport: streamable-http
protocol_response: JSON-RPC 2.0 over text/event-stream
status: live
tool_count: 4
tools:
- name: list-endpoints
  title: List API Endpoints
  description: >-
    Lists all API paths and their HTTP methods with summaries, organized by path.
    Results can be passed directly into 'get-endpoint'.
  input_schema_properties: []
- name: get-endpoint
  title: Get Endpoint Details
  description: >-
    Gets detailed information about a specific API endpoint, including security schemes
    and servers.
  input_schema_properties:
  - path
  - method
- name: search-endpoints
  title: Search API Endpoints
  description: >-
    Performs a deep search through paths, operations, and parameters to discover relevant
    API endpoints.
  input_schema_properties:
  - pattern
- name: execute-request
  title: Execute API Request
  description: Executes an API request with a given HAR request object.
  input_schema_properties:
  - harRequest
  note: >-
    This is the escape hatch that turns a docs server into a call surface: any of the 163
    Mesh operations can be invoked through it. Treat it as a write-capable tool - the Mesh
    API includes customer creation and screening, case transitions, risk-score overrides
    and transaction review decisions.
backing_contract:
