  description: >-
    ComplyAdvantage's newer Mesh platform API, authenticated with OAuth2 bearer tokens (24-hour validity).
    Covers the full customer lifecycle - customer creation and screening (sync or async), risk scoring,
    cases and alerts with stage transitions and assignments, transaction screening and monitoring for
    payments fraud, custom and lookup lists, webhook and email notifications, data exports, user and role
    administration, and regulatory reporting (CTR/SAR prefill). Documented separately at docs.mesh.complyadvantage.com
    with its own OpenAPI schema for customers.
