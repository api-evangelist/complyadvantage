openapi: 3.2.0
info:
  title: Mesh Cases API
  version: v2.0
servers:
- description: ComplyAdvantage Mesh API
  url: https://api.mesh.complyadvantage.com
security:
- BearerAuth: []
tags:
- name: Cases
paths:
  /v2/cases:
    get:
      description: 'Returns a paginated list of cases for the user''s account. Accepts filter and sort query parameters.


        You need one of the "View cases (customer onboarding)", "View cases (customer monitoring)", "View cases (payment screening)" or "View cases (transaction monitoring)" permissions to use this endpoint.'
      operationId: casesService/v2/cases.get
      parameters:
      - deprecated: true
        description: User identifier or null.
        example:
        - 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: query
        name: assignee
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 'Provide an array of user identifiers or blank with which to filter the case list.


          * Includes all cases assigned to user matching user identifiers.


          * If array includes blank, also includes cases without an assignee (i.e. unassigned).'
        example:
        - 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: query
        name: assignee_identifier
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
      - description: Filter cases by specific case types
        example:
        - CUSTOMER_ONBOARDING
        in: query
        name: type
        required: false
        schema:
          items:
            enum:
            - CUSTOMER_ONBOARDING
            - CUSTOMER_MONITORING
            - PAYMENT_SCREENING
            - TRANSACTION_MONITORING
            type: string
          type: array
      - description: Filter cases created on or after this date and time.
        example: '2024-01-22T15:54:27.265Z'
        in: query
        name: created_at_from
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter cases created on or before this date and time.
        example: '2024-01-22T15:54:27.265Z'
        in: query
        name: created_at_to
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter cases by a list of customer identifiers
        example:
        - 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: query
        name: customer.identifier
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
      - description: Filter cases by a list of customer risk levels.
        example:
        - HIGH
        in: query
        name: customer.risk_level
        required: false
        schema:
          items:
            enum:
            - LOW
            - MEDIUM
            - HIGH
            - PROHIBITED
            - SKIPPED
            type: string
          type: array
      - description: 'Provide an array of customer label identifiers or blank with which to filter the case list.


          * Includes all cases matching at least one customer label.


          * If array includes blank, also includes cases without a customer label.'
        example:
        - 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: query
        name: customer.label
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
      - description: 'Provide an array of customer acquisition sources or blank with which to filter the case list.


          * Includes all cases matching at least one customer acquisition source.


          * If array includes blank, also includes cases without a customer acquisition source.'
        example:
        - Business Co.
        in: query
        name: customer.acquisition_source
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Search for cases by customer name, customer external identifier, counterparty name, counterparty external identifier, or external activity identifier (for payment screening cases only). Supports wildcard search.
        example: Boris Johnson
        in: query
        name: search
        required: false
        schema:
          type: string
      - deprecated: true
        description: 'The current state of the case.


          For those using the deprecated case_state, if any new case stages are added the case state response for these will be returned as USER_DEFINED'
        example:
        - ONBOARDING_IN_PROGRESS
        in: query
        name: state
        required: false
        schema:
          items:
            enum:
            - ONBOARDING_NOT_STARTED
            - ONBOARDING_IN_PROGRESS
            - ONBOARDING_ESCALATED
            - ONBOARDING_BLOCKED
            - ONBOARDING_POSITIVE_END_STATE
            - ONBOARDING_MANAGEABLE_RISK_POSITIVE_END_STATE
            - ONBOARDING_NEGATIVE_END_STATE
            - MONITORING_NOT_STARTED
            - MONITORING_IN_PROGRESS
            - MONITORING_ESCALATED
            - MONITORING_BLOCKED
            - MONITORING_NO_RISK_DETECTED_POSITIVE_END_STATE
            - MONITORING_RISK_DETECTED_POSITIVE_END_STATE
            - MONITORING_RISK_DETECTED_NEGATIVE_END_STATE
            - PAYMENT_SCREENING_NOT_STARTED
            - PAYMENT_SCREENING_IN_PROGRESS
            - PAYMENT_SCREENING_ESCALATED
            - PAYMENT_SCREENING_BLOCKED
            - PAYMENT_SCREENING_AWAITING_INFORMATION
            - PAYMENT_SCREENING_PROCESS_PAYMENT_END_STATE
            - PAYMENT_SCREENING_REJECT_PAYMENT_END_STATE
            - TRANSACTION_MONITORING_NOT_STARTED
            - TRANSACTION_MONITORING_IN_PROGRESS
            - TRANSACTION_MONITORING_ESCALATED
            - TRANSACTION_MONITORING_BLOCKED
            - TRANSACTION_MONITORING_ACCEPTED_POSITIVE_END_STATE
            - TRANSACTION_MONITORING_ESCALATED_NEGATIVE_END_STATE
            - USER_DEFINED
            type: string
          type: array
      - description: Provide an array of stage identifiers with which to filter the case list.
        example:
        - 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: query
        name: stage.identifier
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
      - description: Filter cases by a list of risk types. You can retrieve the full list of available risk types from the `/v2/risk-types` endpoint.
        example:
        - PEP_CLASS_1
        in: query
        name: risk_type
        required: false
        schema:
          items:
            enum:
            - ADVERSE_MEDIA_CYBERCRIME
            - ADVERSE_MEDIA_EU_AML_DIRECTIVE
            - ADVERSE_MEDIA_FINANCIAL_AML_CFT
            - ADVERSE_MEDIA_FINANCIAL_CRIME
            - ADVERSE_MEDIA_FINANCIAL_DIFFICULTY
            - ADVERSE_MEDIA_FRAUD_LINKED
            - ADVERSE_MEDIA_FRAUD
            - ADVERSE_MEDIA_GENERAL_AML_CFT
            - ADVERSE_MEDIA_GENERAL
            - ADVERSE_MEDIA_HIGH_RISK
            - ADVERSE_MEDIA_NARCOTICS_AML_CFT
            - ADVERSE_MEDIA_NARCOTICS
            - ADVERSE_MEDIA_OTHER_FINANCIAL
            - ADVERSE_MEDIA_OTHER_MINOR
            - ADVERSE_MEDIA_OTHER_SERIOUS
            - ADVERSE_MEDIA_PROPERTY
            - ADVERSE_MEDIA_REGULATORY
            - ADVERSE_MEDIA_SEXUAL_CRIME
            - ADVERSE_MEDIA_TERRORISM
            - ADVERSE_MEDIA_VIOLENCE_AML_CFT
            - ADVERSE_MEDIA_VIOLENCE_NON_AML_CFT
            - ADVERSE_MEDIA_VIOLENT_CRIME
            - ADVERSE_MEDIA
            - FITNESS_PROBITY
            - PEP_CLASS_1_TO_3
            - PEP_CLASS_1
            - PEP_CLASS_2
            - PEP_CLASS_3
            - PEP_CLASS_4
            - PEP
            - SANCTION_RELATED
            - SANCTION
            - WARNING
            - CUSTOM
            - RISK_WORDS
            type: string
          type: array
      - description: 'Filter cases by alert title(s).


          Allows filtering for cases with alerts matching any of the provided titles.'
        example:
        - Customer screening
        - Payment screening
        in: query
        name: alerts.title
        required: false
        schema:
          items:
            type: string
          minLength: 1
          type: array
      - description: 'Filter cases by the highest priority alert (1-9).


          Allows filtering for cases where the highest priority alert matches the provided value.'
        example:
        - 1
        - 2
        in: query
        name: alerts.highest_priority
        required: false
        schema:
          items:
            format: int32
            type: integer
          maximum: 9
          minimum: 1
          type: array
      - description: 'Filter cases by risk catalog risk type keys.


          Allows filtering for cases with risk types matching any of the provided keys.'
        example:
        - r_sanctions_exposure
        - r_political_exposure
        in: query
        name: risk_catalog_risk_types.key
        required: false
        schema:
          items:
            type: string
          minLength: 1
          type: array
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format of: `[-]property` (`-` descending modifier).


          * Default sort order is ascending (without `-`).


          * Multiple sort criteria are supported.'
        example:
        - -timestamp
        in: query
        name: sort
        required: false
        schema:
          default:
          - -CREATED_AT
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_PaginatedResponseCaseResultResponse'
          description: OK
      summary: Get list of cases
      tags:
      - Cases
  /v2/cases/assign/bulk:
    post:
      description: 'This endpoint synchronously updates assignee for up to 100 cases.


        You need the "Update cases" permission to use this endpoint.'
      operationId: casesService/v2/cases/assign/bulk.post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/case-management_AssignCasesRequest'
        required: true
      responses:
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_BulkActionResponse'
          description: Multi-Status
        '400':
          content:
            application/problem+json:
              examples:
                Too many cases:
                  description: Request exceeds the maximum number of cases that can be updated.
                  value:
                    detail: The maximum allowed number of cases to update is 100
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: TOO_MANY_CASES
              schema:
                $ref: '#/components/schemas/case-management_ProblemDetailErrorResponse'
          description: Bad Request
      summary: Assign cases in bulk
      tags:
      - Cases
  /v2/cases/notes/bulk:
    post:
      description: 'This endpoint creates a note for multiple cases. Up to 100 cases.


        You need the "Update cases" permission to use this endpoint.'
      operationId: casesService/v2/cases/notes/bulk.post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/case-management_CreateCasesNoteRequest'
        required: true
      responses:
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_BulkActionResponse'
          description: Multi-Status
        '400':
          content:
            application/problem+json:
              examples:
                Too many cases:
                  description: Request exceeds the maximum number of cases that can be updated.
                  value:
                    detail: The maximum allowed number of cases to update is 100
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: TOO_MANY_CASES
              schema:
                $ref: '#/components/schemas/case-management_ProblemDetailErrorResponse'
          description: Bad Request
      summary: Leave a note on multiple cases in bulk
      tags:
      - Cases
  /v2/cases/states:
    get:
      deprecated: true
      description: This endpoint returns all possible states to which a case can be transitioned.
      operationId: casesService/v2/cases/states.get
      parameters:
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format of: `[-]property` (`-` descending modifier).


          * Default sort order is ascending (without `-`).


          * Multiple sort criteria are supported.'
        example:
        - -timestamp
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_PaginatedResponseCaseStatesResponse'
          description: OK
      summary: Get a list of available case states
      tags:
      - Cases
  /v2/cases/transition/bulk:
    post:
      description: 'This endpoint synchronously updates state (or stage) for up to 100 cases.


        You need the "Update cases" permission to use this endpoint.'
      operationId: casesService/v2/cases/transition/bulk.post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/case-management_TransitionCasesRequest'
        required: true
      responses:
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_BulkActionResponse'
          description: Multi-Status
        '400':
          content:
            application/problem+json:
              examples:
                Too many cases:
                  description: Request exceeds the maximum number of cases that can be updated.
                  value:
                    detail: The maximum allowed number of cases to update is 100
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: TOO_MANY_CASES
              schema:
                $ref: '#/components/schemas/case-management_ProblemDetailErrorResponse'
          description: Bad Request
      summary: Transition cases in bulk
      tags:
      - Cases
  /v2/cases/{case_identifier}:
    get:
      description: 'This endpoint returns a single case by ID.


        You need one of the "View cases (customer onboarding)", "View cases (customer monitoring)", "View cases (payment screening)" or "View cases (transaction monitoring)" permissions to use this endpoint.'
      operationId: casesService/v2/cases/case_identifier.get
      parameters:
      - description: The unique identifier of the case.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: case_identifier
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_CaseResponse'
          description: OK
      summary: Get a specific case
      tags:
      - Cases
  /v2/cases/{case_identifier}/alerts:
    get:
      description: 'Returns a paginated list of alerts associated with a case.


        You need one of the "View cases (customer onboarding)", "View cases (customer monitoring)", "View cases (payment screening)" or "View cases (transaction monitoring)" permissions to use this endpoint.'
      operationId: casesService/v2/cases/case_identifier/alerts.get
      parameters:
      - description: The unique identifier of the case.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: case_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: Filter alerts by alert identifier
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: query
        name: identifier
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter alerts by states
        example:
        - NOT_STARTED
        in: query
        name: states
        required: false
        schema:
          items:
            enum:
            - NOT_STARTED
            - IN_PROGRESS
            - POSITIVE_END_STATE
            - NEGATIVE_END_STATE
            type: string
          type: array
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format of: `[-]property` (`-` descending modifier).


          * Default sort order is ascending (without `-`).


          * Multiple sort criteria are supported.'
        example:
        - -timestamp
        in: query
        name: sort
        required: false
        schema:
          default:
          - -CREATED_AT
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_PaginatedResponseCaseAlertResponseV2'
          description: OK
      summary: Retrieve the alerts for a case
      tags:
      - Cases
  /v2/cases/{case_identifier}/alerts/{alert_identifier}/notes:
    get:
      description: Returns a paginated list of notes associated with a specific alert. You need the "View alerts" permission to use this endpoint.
      operationId: casesService/v2/cases/case_identifier/alerts/alert_identifier/notes.get
      parameters:
      - description: The unique identifier of the case.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: case_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: The unique identifier of the alert.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: alert_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format of: `[-]property` (`-` descending modifier).


          * Default sort order is ascending (without `-`).


          * Multiple sort criteria are supported.'
        example:
        - -timestamp
        in: query
        name: sort
        required: false
        schema:
          default:
          - -CREATED_AT
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_PaginatedResponseAlertNoteResponse'
          description: OK
        '404':
          content:
            application/problem+json:
              examples:
                Alert not found:
                  description: No alert exists for the given alert identifier, or it does not belong to the specified case.
                  value:
                    detail: Alert 3fa85f64-5717-4562-b3fc-2c963f66afa6 not found for client 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: ALERT_NOT_FOUND
                Case not found:
                  description: No case exists for the given case identifier.
                  value:
                    detail: Case 3fa85f64-5717-4562-b3fc-2c963f66afa6 not found
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: CASE_NOT_FOUND
              schema:
                $ref: '#/components/schemas/case-management_ProblemDetailErrorResponse'
          description: Not found
      summary: Get the notes on an alert
      tags:
      - Cases
    post:
      description: Creates a note linked to a specific alert. You need the "Update alerts" permission to use this endpoint.
      operationId: casesService/v2/cases/case_identifier/alerts/alert_identifier/notes.post
      parameters:
      - description: The unique identifier of the case.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: case_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: The unique identifier of the alert.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: alert_identifier
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/case-management_CreateCaseNoteRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_AlertNoteResponse'
          description: Created
        '400':
          content:
            application/problem+json:
              examples:
                Note content is blank:
                  description: The note content must not be blank.
                  value:
                    detail: Added note cannot be blank.
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: BAD_REQUEST
              schema:
                $ref: '#/components/schemas/case-management_ProblemDetailErrorResponse'
          description: Bad request
        '404':
          content:
            application/problem+json:
              examples:
                Alert not found:
                  description: No alert exists for the given alert identifier, or it does not belong to the specified case.
                  value:
                    detail: Alert 3fa85f64-5717-4562-b3fc-2c963f66afa6 not found for client 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: ALERT_NOT_FOUND
                Case not found:
                  description: No case exists for the given case identifier.
                  value:
                    detail: Case 3fa85f64-5717-4562-b3fc-2c963f66afa6 not found
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: CASE_NOT_FOUND
              schema:
                $ref: '#/components/schemas/case-management_ProblemDetailErrorResponse'
          description: Not found
      summary: Leave a note on an alert
      tags:
      - Cases
  /v2/cases/{case_identifier}/assign:
    post:
      description: 'This endpoint updates the assignee for a single case (to a new value or to null).


        You need the "Update cases" permission to use this endpoint.'
      operationId: casesService/v2/cases/case_identifier/assign.post
      parameters:
      - description: The unique identifier of the case.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: case_identifier
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/case-management_CaseAssignment'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_AssignedCaseResponse'
          description: OK
      summary: Assign a case to a user
      tags:
      - Cases
  /v2/cases/{case_identifier}/notes:
    get:
      description: 'Returns a paginated list of notes associated with a case.


        You need one of the "View cases (customer onboarding)", "View cases (customer monitoring)", "View cases (payment screening)" or "View cases (transaction monitoring)" permissions to use this endpoint.'
      operationId: casesService/v2/cases/case_identifier/notes.get
      parameters:
      - description: The unique identifier of the case.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: case_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format of: `[-]property` (`-` descending modifier).


          * Default sort order is ascending (without `-`).


          * Multiple sort criteria are supported.'
        example:
        - -timestamp
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_PaginatedResponseNoteResponse'
          description: OK
      summary: Get the notes on a case
      tags:
      - Cases
    post:
      description: Creates a note linked to a specific case.
      operationId: casesService/v2/cases/case_identifier/notes.post
      parameters:
