            - ZWL
            type: string
          type: array
      - description: Filter by minimum base amount (inclusive).
        example: 100
        in: query
        name: base_value.amount_from
        required: false
        schema:
          format: double
          type: number
      - description: Filter by maximum base amount (inclusive).
        example: 5000
        in: query
        name: base_value.amount_to
        required: false
        schema:
          format: double
          type: number
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
      - description: Filter by transaction evaluation outcome.
        example:
        - HOLD
        - PENDING
        in: query
        name: evaluation_outcome
        required: false
        schema:
          items:
            enum:
            - PENDING
            - PROCESS
            - ALLOW
            - HOLD
            - ERROR
            type: string
          type: array
      - description: Filter by transaction type.
        example:
        - BANK_PAYMENT
        - CARD_PAYMENT
        - REMITTANCE
        - CRYPTO
        in: query
        name: type
        required: false
        schema:
          items:
            enum:
            - BANK_PAYMENT
            - CARD_PAYMENT
            - REMITTANCE
            - CRYPTO
            type: string
          type: array
      - description: Filter by transaction review decision.
        example:
        - RELEASE
        - REJECT
        in: query
        name: review_decision
        required: false
        schema:
          items:
            enum:
            - NOT_APPLICABLE
            - NOT_REVIEWED
            - RELEASE
            - REJECT
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/search_PaginatedResponseTransactionV3'
          description: OK
      summary: Get a list of transactions
      tags:
      - Transactions
  /v3/transactions/custom-fields:
    get:
      description: Returns a paginated list of transaction custom fields configured for the account.
      operationId: activityStoreListCustomFields
      parameters:
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format of: `[-]property` (`-` descending modifier).


          * Default sort order is ascending (without `-`).


          * Multiple sort criteria are supported.'
        example:
        - -timestamp
        in: query
        name: sort
        required: false
        schema:
          default: []
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_PaginatedResponseCustomField'
          description: Paginated list of custom fields for the account
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: List custom fields for the account
      tags:
      - Transactions
    post:
      description: When you submit a custom field to us, an internal identifier will be assigned. This API allows you to create a custom field for your account.
      operationId: activityStoreCreateCustomField
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/activity_CreateCustomFieldRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_CustomField'
          description: Custom field created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Invalid request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: Create a new custom field
      tags:
      - Transactions
  /v3/transactions/custom-fields/{custom_field_identifier}:
    patch:
      description: Update the display_name and/or description of an existing custom field for your account.
      operationId: activityStoreUpdateCustomField
      parameters:
      - description: The identifier of the custom field to update.
        example: 12345678-9012-3456-7890-123456789012
        in: path
        name: custom_field_identifier
        required: true
        schema:
          description: The identifier of the custom field to update.
          example: 12345678-9012-3456-7890-123456789012
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/activity_UpdateCustomFieldRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_CustomField'
          description: Custom field updated successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Validation error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Custom field not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: Update an existing custom field
      tags:
      - Transactions
  /v3/transactions/external/{identifier}:
    get:
      description: When you submit a Transaction to us, you provide us with your identifier for the Transaction. This API allows you to retrieve a Transaction using this identifier you supplied to us.
      operationId: activityStoreGetTransactionUsingExternalIdentifier
      parameters:
      - description: Your identifier for the transaction.
        example: YourUniqueTransactionIdentifier
        in: path
        name: identifier
        required: true
        schema:
          description: Your identifier for the transaction.
          example: YourUniqueTransactionIdentifier
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_TransactionV3'
          description: Stored Transaction Information
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Transaction not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: Retrieve a Transaction using your identifier as a reference
      tags:
      - Transactions
  /v3/transactions/process:
    post:
      description: Creates a transaction and executes our payment screening and transaction monitoring processes. The response will indicate whether the transaction should be held or processed. Updates a transaction if a transaction with the same external_identifier, occurred_at, customer_external_identifier and details.type already exists but other data has changed. Supports updating existing transactions on the Synchronous Transaction Monitoring flow only; not supported for fast payment screening or async flows. This endpoint requires PAYMENT_SCREENING_BASE and/or TRANSACTION_MONITORING_BASE account permission depending on the configuration identifies supplied with the payload.
      operationId: orchestrationLayerAPIPostV3TransactionProcess
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ol_CreateAndProcessTransactionDTO'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                Transaction with configurations array (ASYNC TM with PENDING outcome):
                  description: Transaction with configurations array (ASYNC TM with PENDING outcome)
                  value:
                    evaluation_result:
                      errors: []
                      outcome: PROCESS
                      scenario_evaluations:
                      - evaluation_result_delivery:
                          method: WEBHOOK
                          webhook_identifier: 03edb86e-5b3e-444e-9727-08d92b442b59
                        outcome: PENDING
                        processing_method: ASYNCHRONOUS
                        results: []
                        scenario_configuration_identifier: 01973ffe-b3db-76b4-a114-9c2f1746f6d5
                      screening_evaluation_results:
                        outcome: PROCESS
                        payment_screening_configuration_identifier: 01974000-0e58-79c3-b4c8-755c1a00daea
                        processing_method: SYNCHRONOUS
                    transaction:
                      external_identifier: TXN-004-2023-22222
                Transaction with monitoring only (ALLOW outcome):
                  description: Transaction with monitoring only (ALLOW outcome)
                  value:
                    evaluation_result:
                      errors: []
                      outcome: ALLOW
                      scenario_evaluations:
                      - outcome: ALLOW
                        processing_method: SYNCHRONOUS
                        results:
                        - outcome: ALLOW
                          priority: 2
                          scenario_identifier: 01973ffe-9792-7666-aaa7-2f84aa243eac
                          scenario_name: Velocity Check
                        scenario_configuration_identifier: 01973ffe-b3db-76b4-a114-9c2f1746f6d5
                    transaction:
                      external_identifier: TXN-003-2023-11111
                Transaction with screening and monitoring (HOLD outcome):
                  description: Transaction with screening and monitoring (HOLD outcome)
                  value:
                    evaluation_result:
                      errors: []
                      outcome: HOLD
                      scenario_evaluations:
                      - outcome: HOLD
                        processing_method: SYNCHRONOUS
                        results:
                        - outcome: HOLD
                          priority: 1
                          scenario_identifier: 01973fff-adc2-738f-bb92-0ccf9848ddd8
                          scenario_name: High Value Transaction Monitoring
                        - outcome: ALLOW
                          priority: 3
                          scenario_identifier: 01973ffe-f268-7460-bf21-24ce26389d23
                          scenario_name: Unusual Pattern Detection
                        scenario_configuration_identifier: 01973fff-c779-7b50-b72d-f703cfad96b8
                      screening_evaluation_results:
                        outcome: PROCESS
                        payment_screening_configuration_identifier: 01973fff-de4e-795c-9265-a00596f88cbf
                        processing_method: SYNCHRONOUS
                    transaction:
                      external_identifier: TXN-002-2023-67890
                Transaction with screening only (PROCESS outcome):
                  description: Transaction with screening only (PROCESS outcome)
                  value:
                    evaluation_result:
                      errors: []
                      outcome: PROCESS
                      scenario_evaluations: []
                      screening_evaluation_results:
                        outcome: PROCESS
                        payment_screening_configuration_identifier: 01974000-0e58-79c3-b4c8-755c1a00daea
                        processing_method: SYNCHRONOUS
                    transaction:
                      external_identifier: TXN-001-2023-12345
              schema:
                $ref: '#/components/schemas/ol_TransactionResponseDTO'
          description: Transaction successfully processed
        '400':
          content:
            application/json:
              examples:
                Invalid configurations array - PS cannot be ASYNCHRONOUS:
                  description: Invalid configurations array - PS cannot be ASYNCHRONOUS
                  value:
                    detail: Configuration validation failed
                    errors:
                    - field: configurations
                      reasons:
                      - message: Asynchronous payment screening is not supported
                        reason: invalid
                      value: null
                    identifier: 01974025-5d6b-732c-ba71-a7cb6e98907f
                    status: 400
                    timestamp: '2025-05-14T09:30:04.201Z'
                    title: Validation Error
                Invalid screening configuration:
                  description: Invalid screening configuration
                  value:
                    detail: Invalid Screening Configuration Identifier
                    errors:
                    - field: screening_configuration_identifier
                      reasons:
                      - message: Missing or archived screening configuration identifier provided
                        reason: missing_or_invalid
                      value: 01974025-3d4b-7980-849b-470fa8fd096a
                    identifier: 01974025-5d6b-732c-ba71-a7cb6e98907f
                    status: 400
                    timestamp: '2025-05-14T09:30:04.201Z'
                    title: Validation Error
                Transaction external identifier too long:
                  description: Transaction external identifier too long
                  value:
                    detail: There were validation errors with your request
                    errors:
                    - field: transaction.external_identifier
                      reasons:
                      - message: size must be between 0 and 512
                        reason: reason
                      value: very_long_transaction_identifier_that_exceeds_maximum_length...
                    identifier: 01974025-94a5-788c-b4a3-513127210fd0
                    status: 400
                    timestamp: '2023-12-11T09:30:05.975Z'
                    title: Validation Error
                Unknown customer:
                  description: Unknown customer
                  value:
                    errors:
                    - field: customer_external_identifier
                      reasons:
                      - message: 'The provided customer could not be found: unknown-customer-id-12345'
                        reason: missing
                      value: unknown-customer-id-12345
                    identifier: 01974027-9600-7b78-a07f-798f1a211073
                    status: 400
                    timestamp: '2024-12-11T09:35:06.677Z'
                    title: Customer not found in our system
              schema:
                $ref: '#/components/schemas/ol_ProblemDetailErrorResponse'
          description: Validation Error
        '409':
          content:
            application/json:
              examples:
                Duplicate Transaction:
                  description: Duplicate Transaction
                  value:
                    detail: Transaction with external identifier 'TXN-DUPLICATE-123' already exists
                    errors:
                    - field: transaction.external_identifier
                      reasons:
                      - message: A transaction with this external identifier already exists
                        reason: duplicate
                      value: TXN-DUPLICATE-123
                    identifier: 01974024-d616-758c-aded-3c07eaa32c3b
                    status: 409
                    timestamp: '2023-12-11T09:30:10.975Z'
                    title: Duplicate Transaction
              schema:
                $ref: '#/components/schemas/ol_ProblemDetailErrorResponse'
          description: Duplicate Transaction
      summary: Create and process a transaction
      tags:
      - Transactions
  /v3/transactions/{identifier}:
    get:
      description: When you submit a transaction to us we allocate an internal identifier for the Transaction. This API allows you to retrieve a Transaction using the identifier we set when we received your transaction.
      operationId: activityStoreGetTransactionUsingInternalIdentifier
      parameters:
      - description: Our identifier for the transaction.
        example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
        in: path
        name: identifier
        required: true
        schema:
          description: Our identifier for the transaction.
          example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_TransactionV3'
          description: Stored Transaction Information
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Transaction not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: Retrieve a Transaction using our identifier
      tags:
      - Transactions
  /v3/transactions/{identifier}/review:
    post:
      description: When a transaction is held (evaluation_outcome=HOLD), a decision can be made to either release or reject the transaction. This decision will be recorded in the review_decision field and sent as a webhook, if configured. This endpoint cannot be used for transactions that are not held.
      operationId: activityStorePostTransactionReviewDecision
      parameters:
      - description: Our identifier for the transaction.
        example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
        in: path
        name: identifier
        required: true
        schema:
          description: Our identifier for the transaction.
          example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/activity_ReviewDecisionRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ReviewDecisionResponse'
          description: Review decision created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Review decision can only be applied to HOLD outcome
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Transaction not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: Make a decision on a held transaction
      tags:
      - Transactions
  /v3/transactions/{identifier}/risk_types:
    put:
      description: This endpoint allows you to set the risk types for a transaction. Currently supports setting the risk to 'r_fraud' or removing all risks by passing an empty list.
      operationId: activityStoreSetTransactionRiskTypes
      parameters:
      - description: Internal identifier for the transaction.
        example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
        in: path
        name: identifier
        required: true
        schema:
          description: Internal identifier for the transaction.
          example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/activity_TransactionRiskTypesRequestBody'
        required: true
      responses:
        '204':
          description: Transaction risks set successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Invalid risk type value - must be one of the allowed values [r_fraud]
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Transaction not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: Set or clear risk types for a transaction
      tags:
      - Transactions
  /v3/transactions/{identifier}/versions:
    get:
      description: Returns a paginated list of all versions of a Transaction, sorted by version in descending order. Initially every transaction has exactly one version.
      operationId: activityStoreListTransactionVersions
      parameters:
      - description: Our identifier for the transaction.
        example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
        in: path
        name: identifier
        required: true
        schema:
          description: Our identifier for the transaction.
          example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
          format: uuid
          type: string
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 10
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format of: `[-]property` (`-` descending modifier).


          * Default sort order is ascending (without `-`).


          * Multiple sort criteria are supported.'
        example:
        - -timestamp
        in: query
        name: sort
        required: false
        schema:
          default:
          - -version
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_PaginatedResponseTransactionV3'
          description: Paginated list of Transaction versions, sorted by version descending
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Transaction not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: Retrieve all versions of a Transaction
      tags:
      - Transactions
  /v3/transactions/{identifier}/versions/{version}:
    get:
      description: When you submit a transaction to us we allocate an internal identifier for the Transaction. This API allows you to retrieve a specific version of a Transaction using the identifier we set when we received your transaction.
      operationId: activityStoreGetTransactionVersionByInternalIdentifier
      parameters:
      - description: Our identifier for the transaction.
        example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
        in: path
        name: identifier
        required: true
        schema:
          description: Our identifier for the transaction.
          example: 01966d5b-e4fa-7b60-a2d7-5b5225fbd39a
          format: uuid
          type: string
      - description: The version of the transaction.
        example: 1
        in: path
        name: version
        required: true
        schema:
          description: The version of the transaction.
          example: 1
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_TransactionV3'
          description: Stored Transaction Information
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Transaction not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity_ProblemDetailErrorResponse'
          description: Internal Server Error
      summary: Retrieve a specific version of a Transaction using our identifier
      tags:
      - Transactions
components:
  schemas:
    activity_CounterpartyPartyIdentifierV3:
      allOf:
      - $ref: '#/components/schemas/activity_PartyIdentifierV3'
      - properties:
          bank_account:
            $ref: '#/components/schemas/activity_BankAccountV3'
          external_identifier:
            description: Your unique identifier for Counterparty to which this Party is linked.
            example: MyCounterpartyIdentifier
            maxLength: 512
            minLength: 0
            type: string
        type: object
      description: Represents the identification details of a counterparty.
      required:
      - type
      title: Counterparty Party Identifier
      type: object
    ol_AddressV3:
      description: Address of the ATM.
      discriminator:
        propertyName: format
      properties:
        format:
          $ref: '#/components/schemas/ol_AddressFormatV3'
      required:
      - format
      type: object
    ol_AuthorizationInfoV3:
      description: Authorization information.
      properties:
        identifier:
          description: Unique authorization identifier.
          example: auth_123456789
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
        response:
          $ref: '#/components/schemas/ol_AuthorizationResponseV3'
        state:
          description: Represents the state of an authorization request.
          enum:
          - APPROVED
          - DECLINED
          - PENDING
          - EXPIRED
          - CANCELLED
          example: APPROVED
          type:
          - string
          - 'null'
