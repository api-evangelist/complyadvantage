          description: Case unique identifier.
          format: uuid
          type: string
        last_user_stage:
          $ref: '#/components/schemas/case-management_Stage'
        last_user_state:
          deprecated: true
          description: 'The last state the case was transitioned to by a user (as opposed to a system action).


            For those using the deprecated case_state, if any new case stages are added the case state response for these will be returned as  USER_DEFINED'
          enum:
          - ONBOARDING_NOT_STARTED
          - ONBOARDING_IN_PROGRESS
          - ONBOARDING_ESCALATED
          - ONBOARDING_BLOCKED
          - ONBOARDING_POSITIVE_END_STATE
          - ONBOARDING_MANAGEABLE_RISK_POSITIVE_END_STATE
          - ONBOARDING_NEGATIVE_END_STATE
          - MONITORING_NOT_STARTED
          - MONITORING_IN_PROGRESS
          - MONITORING_ESCALATED
          - MONITORING_BLOCKED
          - MONITORING_NO_RISK_DETECTED_POSITIVE_END_STATE
          - MONITORING_RISK_DETECTED_POSITIVE_END_STATE
          - MONITORING_RISK_DETECTED_NEGATIVE_END_STATE
          - PAYMENT_SCREENING_NOT_STARTED
          - PAYMENT_SCREENING_IN_PROGRESS
          - PAYMENT_SCREENING_ESCALATED
          - PAYMENT_SCREENING_BLOCKED
          - PAYMENT_SCREENING_AWAITING_INFORMATION
          - PAYMENT_SCREENING_PROCESS_PAYMENT_END_STATE
          - PAYMENT_SCREENING_REJECT_PAYMENT_END_STATE
          - TRANSACTION_MONITORING_NOT_STARTED
          - TRANSACTION_MONITORING_IN_PROGRESS
          - TRANSACTION_MONITORING_ESCALATED
          - TRANSACTION_MONITORING_BLOCKED
          - TRANSACTION_MONITORING_ACCEPTED_POSITIVE_END_STATE
          - TRANSACTION_MONITORING_ESCALATED_NEGATIVE_END_STATE
          - USER_DEFINED
          example: ONBOARDING_POSITIVE_END_STATE
          type:
          - string
          - 'null'
        payment:
          $ref: '#/components/schemas/case-management_PaymentSummaryResponse'
        review_items_count:
          description: Number of items to review in case.
          format: int32
          type: integer
        risk_catalog_risk_types:
          description: Risk catalog risk types associated with the case
          items:
            $ref: '#/components/schemas/case-management_RiskCatalogResponse'
          type: array
        risk_types:
          description: Risk types of case.
          items:
            $ref: '#/components/schemas/case-management_RiskTypesResponse'
          type: array
        stage:
          $ref: '#/components/schemas/case-management_Stage'
        state:
          deprecated: true
          description: 'The current state of the case.


            For those using the deprecated case_state, if any new case stages are added the case state response for these will be returned as USER_DEFINED'
          enum:
          - ONBOARDING_NOT_STARTED
          - ONBOARDING_IN_PROGRESS
          - ONBOARDING_ESCALATED
          - ONBOARDING_BLOCKED
          - ONBOARDING_POSITIVE_END_STATE
          - ONBOARDING_MANAGEABLE_RISK_POSITIVE_END_STATE
          - ONBOARDING_NEGATIVE_END_STATE
          - MONITORING_NOT_STARTED
          - MONITORING_IN_PROGRESS
          - MONITORING_ESCALATED
          - MONITORING_BLOCKED
          - MONITORING_NO_RISK_DETECTED_POSITIVE_END_STATE
          - MONITORING_RISK_DETECTED_POSITIVE_END_STATE
          - MONITORING_RISK_DETECTED_NEGATIVE_END_STATE
          - PAYMENT_SCREENING_NOT_STARTED
          - PAYMENT_SCREENING_IN_PROGRESS
          - PAYMENT_SCREENING_ESCALATED
          - PAYMENT_SCREENING_BLOCKED
          - PAYMENT_SCREENING_AWAITING_INFORMATION
          - PAYMENT_SCREENING_PROCESS_PAYMENT_END_STATE
          - PAYMENT_SCREENING_REJECT_PAYMENT_END_STATE
          - TRANSACTION_MONITORING_NOT_STARTED
          - TRANSACTION_MONITORING_IN_PROGRESS
          - TRANSACTION_MONITORING_ESCALATED
          - TRANSACTION_MONITORING_BLOCKED
          - TRANSACTION_MONITORING_ACCEPTED_POSITIVE_END_STATE
          - TRANSACTION_MONITORING_ESCALATED_NEGATIVE_END_STATE
          - USER_DEFINED
          example: ONBOARDING_POSITIVE_END_STATE
          type: string
        subjects:
          description: Subjects associated with the case, capped at the first 100.
          items:
            $ref: '#/components/schemas/case-management_Subject'
          maxItems: 100
          type: array
        subjects_summary:
          $ref: '#/components/schemas/case-management_SubjectsSummary'
        type:
          description: Case type.
          enum:
          - CUSTOMER_ONBOARDING
          - CUSTOMER_MONITORING
          - PAYMENT_SCREENING
          - TRANSACTION_MONITORING
          example: CUSTOMER_ONBOARDING
          type: string
        updated_at:
          description: Case last updated date and time.
          format: date-time
          type: string
        updated_by:
          description: Last state of case set by an user.
          format: uuid
          type:
          - string
          - 'null'
