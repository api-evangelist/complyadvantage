  /v2/cases/{case_identifier}/subjects:
    get:
      description: 'Returns a paginated list of subjects associated with a case.


        You need one of the "View cases (customer onboarding)", "View cases (customer monitoring)", "View cases (payment screening)" or "View cases (transaction monitoring)" permissions to use this endpoint.'
      operationId: casesService/v2/cases/case_identifier/subjects.get
      parameters:
      - description: The unique identifier of the case.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: case_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: One-based page index (1..N)
        example: 1
        in: query
        name: page_number
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The size of the page to be returned
        example: 20
        in: query
        name: page_size
        required: false
        schema:
          default: 25
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_PaginatedResponseSubjectApi'
          description: OK
      summary: Retrieve the subjects for a case
      tags:
      - Cases
  /v2/cases/{case_identifier}/transition:
    post:
      description: 'This endpoint transitions a case to a new stage.


        Note:


        - case_state is deprecated. Please use case_stage instead.


        - For those already integrated using case_state, if any new case stages are added the case state response for these will be returned as USER_DEFINED


        You need the "Update cases" permission to use this endpoint.'
      operationId: casesService/v2/cases/case_identifier/transition.post
      parameters:
      - description: The unique identifier of the case.
        example: 01899c37-576b-7677-b41a-9c9fdbd3bde1
        in: path
        name: case_identifier
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/case-management_CaseTransitionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case-management_CaseTransitionResponse'
          description: OK
        '400':
          content:
            application/problem+json:
              examples:
                Invalid state for case type:
                  description: The target case state is not valid for this type of case.
                  value:
                    detail: State MONITORING_BLOCKED is not a valid state for case type CUSTOMER_ONBOARDING
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: INVALID_STATE_FOR_CASE_TYPE
                Target state is not an end state:
                  description: The target state must be a valid end state.
                  value:
                    detail: State ONBOARDING_NOT_STARTED is not a valid end state
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: INVALID_END_STATE
                Unable to update state for a payment screening case in end state:
                  description: Once a payment screening case is in an end state, its state cannot be updated again.
                  value:
                    detail: Case 3fa85f64-5717-4562-b3fc-2c963f66afa6 is a payment screening case and is already in an end state, so its state cannot be changed.
                    identifier: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    timestamp: '2023-12-19T09:27:17.835Z'
                    title: CANNOT_TRANSITION_PAYMENT_SCREENING_CASES_FROM_END_STATE
              schema:
                $ref: '#/components/schemas/case-management_ProblemDetailErrorResponse'
          description: Bad request
      summary: Transition a case to a stage
      tags:
      - Cases
