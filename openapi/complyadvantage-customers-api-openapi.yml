  /v2/customers/{customer_identifier}/workflows/sync/rescreen:
    post:
      description: 'This endpoint initiates the synchronous ''rescreen'' workflow for your customer. The workflow consists of two steps:

        1. **Customer Rescreening:** The customer is screened against the latest data sources to identify any new risk information.

        2. **Alerting:** If new, relevant, risks are found an alert is generated. The workflow executes synchronously, returning the workflow status and result immediately.

        The rescreening operation applies the rules and settings defined in the customer''s monitoring configuration. If no monitoring configuration is currently assigned to the customer, the system will default to using the initial screening configuration applied when the customer was first screened. Rescreen events count towards your total onboarding search volumes You need "Account has access to monitor on demand functionality" enabled to use this endpoint.'
      operationId: orchestrationLayerAPIPostV2RescreenCustomerWorkflowsSync
      parameters:
      - description: Identifier of the customer to rescreen
        example: b30a02b7-eb74-445a-b678-b778ab3f091e
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      - description: 'A unique, client-generated string that identifies a single operational attempt. You must generate a new key for every distinct operation, and use the exact same key when retrying a failed request to prevent duplication.

          The usage of this key is recommended to ensure safe retries without duplicate processing or billing. While any unique string is accepted, we strongly recommend using a standard UUID to guarantee global uniqueness.'
        example: 019b2d24-cdcc-737c-9186-2c87451edf7f
        in: header
        name: X-ComplyAdvantage-Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 0
          type: string
      - description: Specifies the screening logic to apply. Set to DELTA to perform a differential screen, which compares the new result against the customer's previous screening baseline and only alerts on new or changed risk factors.
        example: DELTA
        in: query
        name: rescreen_type
        required: false
        schema:
          default: DELTA
          enum:
          - DELTA
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                WORKFLOW COMPLETED:
                  description: Once all step workflows are marked as COMPLETED then the workflow status will be marked as COMPLETED.
                  value:
                    status: COMPLETED
                    step_details:
                      alerting:
                        identifier: null
                        status: COMPLETED
                        step_output:
                          alerts:
                          - identifier: 019b2ce4-6850-7451-8d50-a2525e482426
                      customer-rescreening:
                        identifier: 019b2ce4-5766-7a85-bcc8-138a1661d7d7
                        status: COMPLETED
                        step_output:
                          aml_types:
                          - SANCTION
                          - ADVERSE_MEDIA
                          - ADVERSE_MEDIA_V2_CYBERCRIME
                          - PEP_CLASS_1
                          - PEP_CLASS_2
                          - WARNING
                          rescreen_type: DELTA
                          rescreened_at: '2025-12-17T15:18:44.000Z'
                          rescreening_result: HAS_CHANGES
                    steps:
                    - customer-rescreening
                    - alerting
                    workflow_instance_identifier: 019b2ce4-5718-71be-9899-a90b319ea9d6
                    workflow_type: rescreen-customer
                WORKFLOW COMPLETED (NO CHANGES FOUND):
                  description: Once all step workflows are marked as COMPLETED then the workflow status will be marked as COMPLETED.
                  value:
                    status: COMPLETED
                    step_details:
                      alerting:
                        identifier: null
                        status: COMPLETED
                        step_output:
                          alerts: []
                      customer-rescreening:
                        identifier: 019b2ce4-5766-7a85-bcc8-138a1661d7d7
                        status: COMPLETED
                        step_output:
                          rescreen_type: DELTA
                          rescreened_at: '2025-12-17T15:18:44.000Z'
                          rescreening_result: NO_CHANGES
                    steps:
                    - customer-rescreening
                    - alerting
                    workflow_instance_identifier: 019b2ce4-5718-71be-9899-a90b319ea9d6
                    workflow_type: rescreen-customer
                WORKFLOW ERRORED:
                  description: If any of the step workflows returns an ERRORED state then the workflow status will be marked as ERRORED.
                  value:
                    status: ERRORED
                    step_details:
                      alerting:
                        identifier: null
                        status: SKIPPED
                        step_output: {}
                      customer-rescreening:
                        error_message: An error occurred while rescreening the customer
                        identifier: 019b298b-3ef5-75ef-85f7-bf43f6909986
                        status: ERRORED
                        step_output: {}
                    steps:
                    - customer-rescreening
                    - alerting
                    workflow_instance_identifier: 019b298b-3ed8-73a1-9efc-24c7f2dfc7b9
                    workflow_type: rescreen-customer
              schema:
                $ref: '#/components/schemas/ol_WorkflowState'
          description: Rescreen customer workflow executed
        '400':
          content:
            application/json:
              examples:
                Invalid workflow_type:
                  description: Invalid workflow_type
                  value:
                    identifier: 018c3ff3-7099-7090-a15b-8daee4cb81df
                    status: 400
                    timestamp: '2023-12-11T09:30:03.975Z'
                    title: 'Invalid workflow_type: Invalid'
                Validation error:
                  description: Validation error
                  value:
                    identifier: 018c3ff3-7099-7090-a15b-8daee4cb81df
                    status: 400
                    timestamp: '2023-12-11T09:30:03.975Z'
                    title: Validation error
              schema:
                $ref: '#/components/schemas/ol_ProblemDetailErrorResponse'
          description: Bad request
      summary: Rescreen a customer synchronously
      tags:
      - Customers
  /v2/customers/{customer_identifier}/workflows/sync/update-and-rescore:
    post:
      description: 'This endpoint initiates the synchronous ''update and re-score'' workflow for your customer in synchronous mode. The workflow consists of two steps:

        1. **Customer Record Update:** The customer record, and associated view of products, is updated.

        2. **Risk Scoring:** The risk score is re-calculated for the updated customer. The workflow executes synchronously returning the workflow status. This end-point is currently idempotent: in case of downstream error you can re-send the exact same request, and the workflow will be retried. In using this endpoint:

        - **The Customer profile is mandatory and must be provided in full:** * This endpoint overwrites the previous version of the customer record, any missing fields are treated as removed data and this data will be deleted from the customer view.

        - **The associated Product information is optional** and behaves in one of two ways: * If the `products` tag is not provided, the current list of products will stay as is * If the `products` tag is provided, it will overwrite the previous version of products. As such, all products - new, changed, and unchanged should be provided. You need the "Update customers" permission to use this endpoint.'
      operationId: updateCustomer
      parameters:
      - description: Customer identifier of the customer to update
        example: b30a02b7-eb74-445a-b678-b778ab3f091e
        in: path
        name: customer_identifier
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ol_UpdateAndRescoreCustomerRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                WORKFLOW COMPLETED:
                  description: Once all step workflows are marked as COMPLETED then the workflow status will be marked as COMPLETED.
                  value:
                    status: COMPLETED
                    step_details:
                      customer-update:
                        identifier: 018c3ff3-7275-7dc2-94a5-fe30315240b1
                        status: COMPLETED
                        step_output:
                          customer_identifier: 018c3ff3-746b-70de-9eb5-033634ec07eb
                          customer_version: 2
                          external_identifier: abcd-1234
                      risk-scoring:
                        identifier: 018c3ff3-74c5-7645-b0fd-a2e24754067f
                        status: COMPLETED
                        step_output:
                          overall_level: LOW-RISK
                          overall_value: 0
                    steps:
                    - customer-update
                    - risk-scoring
                    workflow_instance_identifier: 018c3ff3-7099-7090-a15b-8daee4cb81df
                    workflow_type: update-and-rescore
                WORKFLOW ERRORED:
                  description: If any of the step workflows returns an ERRORED state then it will be required to contact support to resolve the issue.
                  value:
                    status: ERRORED
                    step_details:
                      customer-update:
                        error_message: Something wrong
                        identifier: 018c4014-1de6-7d9d-ae92-eeacf245a259
                        status: ERRORED
                        step_output: {}
                      risk-scoring:
                        identifier: null
                        status: SKIPPED
                        step_output: {}
                    steps:
                    - customer-update
                    - risk-scoring
                    workflow_instance_identifier: 018c4014-1c51-7b7d-a97c-044b5b624916
                    workflow_type: update-and-rescore
                WORKFLOW IN PROGRESS:
                  description: If any step workflow is still IN PROGRESS then the following response will be provided. Further checks will be required to receive the latest status.
                  value:
                    status: IN-PROGRESS
                    step_details:
                      customer-update:
                        identifier: 018c3ff4-7ad2-7bd3-bd5e-c31abc2f691c
                        status: IN-PROGRESS
                        step_output: {}
                      risk-scoring:
                        identifier: 018c3ff4-7d34-7017-a2fb-d39975d453fd
                        status: NOT-STARTED
                        step_output: {}
                    steps:
                    - customer-update
                    - risk-scoring
                    workflow_instance_identifier: 018c3ff4-7979-7f95-98be-886116e3315c
                    workflow_type: update-and-rescore
              schema:
                $ref: '#/components/schemas/ol_WorkflowState'
          description: Sync update and re-score workflow executed
        '400':
          content:
            application/json:
              examples:
                Validation error:
                  description: Validation error
                  value:
                    detail: There were validation errors with your request
                    identifier: 018e1971-1c6f-761f-a510-43540727ff48
                    instance: https://example/v2/customers/56fb9e63-de1b-4cbc-9e7e-c5e15391eb09/workflows/sync/update-and-rescore
                    properties:
                      errors:
                      - field: full_name
                        reasons:
                        - key: full_name
                          message: full_name size must be between 0 and 50
                          parameters: null
                        rejected: somenamesomenamesomenamesomenamesomenamesomenamesomenamesomenamesomename
                    status: 400
                    timestamp: '2024-03-07T15:03:47.055Z'
                    title: Invalid JSON Request
                    type: about:blank
              schema:
                $ref: '#/components/schemas/ol_ProblemDetailErrorResponse'
          description: Bad request
        '403':
          content:
            application/json:
              examples:
