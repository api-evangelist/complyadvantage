      allOf:
      - $ref: '#/components/schemas/ol_TransactionClassificationDetailsV3'
      - properties:
          base_value:
            $ref: '#/components/schemas/ol_MonetaryValueV3'
          customer_account_balance:
            $ref: '#/components/schemas/ol_AccountBalanceV3'
          details:
            discriminator:
              mapping:
                BANK_PAYMENT: '#/components/schemas/ol_BankPaymentMonetaryTransactionTypeDetailsV3'
                CARD_PAYMENT: '#/components/schemas/ol_CardPaymentMonetaryTransactionTypeDetailsV3'
